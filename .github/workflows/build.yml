name: build

# 推送形如 v2.0.0 的 tag 时自动触发；也可以在 GitHub 网页上手动触发（workflow_dispatch）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # 会同时产出 Apple Silicon + Intel 版本
          - platform: "ubuntu-22.04"
          - platform: "windows-latest"
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential

      - name: install deps & build frontend
        run: |
          npm install
          cd web-react
          npm install
          npm run build

      - name: patch tauri config for CI (no signing)
        shell: bash
        run: |
          node -e "const fs=require('fs'); const p='src-tauri/tauri.conf.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); delete j.plugins.updater.pubkey; j.bundle.createUpdaterArtifacts=false; fs.writeFileSync(p, JSON.stringify(j,null,2)); console.log('patched', JSON.stringify({createUpdaterArtifacts:j.bundle.createUpdaterArtifacts, hasPubkey:!!j.plugins?.updater?.pubkey}))"
          cat src-tauri/tauri.conf.json

      - name: build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: "Agent Workbench v__VERSION__"
          releaseBody: "三端安装包自动构建，见下方 Assets。"
          releaseDraft: true
          prerelease: false
          projectPath: desktop-app