[package]
name = "agent-workbench"
version = "0.1.0"
description = "Agent Workbench - manage your AI agent projects and prompts, synced across devices"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "agent-workbench"
path = "src/main.rs"
