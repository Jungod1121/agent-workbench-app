[package]
name = "agent-workbench"
version = "2.0.0"
description = "Agent Workbench - manage your AI agent projects and prompts, synced across devices"
authors = ["Jungod"]
edition = "2021"
rust-version = "1.85.0"

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[lib]
name = "agent_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros", "net", "sync", "fs"] }
tauri = { version = "2.8.2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"

[[bin]]
name = "agent-workbench"
path = "src/main.rs"
