<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Workbench</title>
<style>
/* CC Switch 对标 · 12-17 落地：64头/无Bento/外密16/无大标题/行式h16/多蓝多圆角阴影500 */
:root{
  --background: 0 0% 100%; --foreground: 240 10% 3.9%;
  --card: 0 0% 100%; --card-foreground: 240 10% 3.9%;
  --popover: 0 0% 100%; --popover-foreground: 240 10% 3.9%;
  --primary: 210 100% 56%; --primary-foreground: 0 0% 100%;
  --secondary: 240 4.8% 95.9%; --secondary-foreground: 240 5.9% 10%;
  --muted: 240 4.8% 95.9%; --muted-foreground: 240 3.8% 46.1%;
  --accent: 240 4.8% 95.9%; --accent-foreground: 240 5.9% 10%;
  --destructive: 0 84.2% 60.2%; --destructive-foreground: 0 0% 98%;
  --border: 240 5.9% 90%; --input: 240 5.9% 90%; --ring: 210 100% 56%;
  --radius: 0.5rem;
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Hiragino Sans GB", Inter, "Noto Sans SC", sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "PingFang SC", Inter, sans-serif;
}
.dark{
  --background: 240 5% 12%; --foreground: 0 0% 98%;
  --card: 240 5% 16%; --card-foreground: 0 0% 98%;
  --popover: 240 5% 16%; --popover-foreground: 0 0% 98%;
  --primary: 210 100% 54%; --primary-foreground: 0 0% 100%;
  --secondary: 240 5% 18%; --secondary-foreground: 0 0% 98%;
  --muted: 240 5% 18%; --muted-foreground: 240 5% 64.9%;
  --accent: 240 5% 18%; --accent-foreground: 0 0% 98%;
  --destructive: 0 62.8% 30.6%; --destructive-foreground: 0 0% 98%;
  --border: 240 5% 24%; --input: 240 5% 24%; --ring: 210 100% 54%;
}
/* ===== 深色模式玻璃拟态（apple-style-design · T1 glass-dark）=====
   范围：顶栏阶段条 stage-pill · 新建按钮（统计看板已用 T0 磨砂）
   玻璃无色：面板只用白色 5–12% 低透明 + 极光背景供其折射；
   顶边受光/底边背光；仅功能层（卡片/控件），内容层保持实心 */
.dark body{
  background:
    radial-gradient(1100px 720px at 12% -8%, rgba(45,212,191,0.10), transparent 60%),
    radial-gradient(1000px 680px at 108% 12%, rgba(79,141,249,0.10), transparent 60%),
    radial-gradient(900px 900px at 55% 118%, rgba(167,139,250,0.08), transparent 62%),
    hsl(var(--background));
  background-attachment: fixed;
}
.dark .main{background:transparent}
.dark .stage-pill,
.dark #addProjectBtn{
  background-color: rgba(255,255,255,0.07);
  background-image: linear-gradient(to bottom, rgba(255,255,255,0.10), transparent 55%);
  -webkit-backdrop-filter: blur(40px) saturate(180%);
  backdrop-filter: blur(40px) saturate(180%);
  border-color: rgba(255,255,255,0.14);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.12),
    inset 0 -1px 0 rgba(0,0,0,0.28),
    0 8px 24px rgba(0,0,0,0.35);
}
.dark .stage-pill-item:hover{background:rgba(255,255,255,0.10)}
.dark #addProjectBtn:hover{background-color:rgba(255,255,255,0.12)}
@media (prefers-reduced-transparency: reduce){
  .dark .usage-bar,.dark .stage-pill,.dark #addProjectBtn{
    -webkit-backdrop-filter:none; backdrop-filter:none;
  }
  .dark .stage-pill,.dark #addProjectBtn{background-color:rgba(255,255,255,0.12)}
  .dark .usage-bar{background:rgba(22,22,23,0.95)}
}
*{box-sizing:border-box}
html{font-family:var(--font-sans); -webkit-font-smoothing:antialiased; line-height:1.5}
body{margin:0; background:hsl(var(--background)); color:hsl(var(--foreground)); font-size:14px}
:focus-visible{outline:2px solid hsl(var(--primary)); outline-offset:2px}
.skip-link{position:absolute; left:-9999px; top:auto; width:1px; height:1px; overflow:hidden}
.skip-link:focus{left:16px; top:16px; width:auto; height:auto; padding:10px 16px; background:hsl(var(--foreground)); color:hsl(var(--background)); border-radius:9999px; z-index:1000; font-size:12px; font-weight:600}
.drag-bar{position:fixed; top:0; left:0; right:0; height:28px; z-index:1000; -webkit-app-region:drag}
[data-tauri-drag-region]{-webkit-app-region:drag}
[data-tauri-no-drag]{-webkit-app-region:no-drag}
.app-shell{position:relative; display:flex; min-height:100vh; padding:28px 0 0; gap:0}
.main{flex:1; min-width:0; display:flex; flex-direction:column; background:hsl(var(--background))}
/* 12 顶高64 → 顶部悬浮岛（长条形，T0 磨砂 + 大圆角） */
.topbar{
  position:sticky; top:8px; z-index:10; height:56px;
  display:flex; align-items:center; gap:12px;
  margin:6px 16px 10px; padding:0 14px;
  border-radius:18px;
  background:rgba(245,245,247,0.8);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border:1px solid rgba(0,0,0,0.08);
  box-shadow:0 8px 24px rgba(0,0,0,0.10);
}
.dark .topbar{background:rgba(22,22,23,0.8); border-color:rgba(255,255,255,0.08); box-shadow:0 8px 24px rgba(0,0,0,0.35)}
.topbar-left{display:flex; align-items:center; gap:0; flex-shrink:0; cursor:pointer; -webkit-app-region:no-drag}
.topbar-left:hover .topbar-title{opacity:0.92; transform:translateY(-0.5px)}
.topbar-title{
  font-family: var(--font-display);
  font-size:20px; font-weight:700; letter-spacing:-0.03em; line-height:1;
  background:linear-gradient(135deg,#2DD4BF 0%,#4F8DF9 45%,#A78BFA 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  cursor:pointer; -webkit-font-smoothing:antialiased;
  transition: opacity .2s, transform .2s;
}
.topbar-meta{font-size:11px; color:hsl(var(--muted-foreground)); margin-left:10px; white-space:nowrap; -webkit-app-region:no-drag}
/* 阶段 pill 单列主导航（CC AppSwitcher 思路） */
.stage-pill-wrap{position:relative; display:flex; align-items:center; min-width:0; max-width:100%; overflow:visible}
.stage-pill{display:inline-flex; align-items:center; gap:4px; padding:4px; background:hsl(var(--muted)); border-radius:12px; overflow:hidden}
.stage-pill-item{
  min-height:32px; padding:6px 12px; border-radius:8px; border:1px solid transparent; background:transparent;
  font-size:13px; font-weight:500; color:hsl(var(--muted-foreground)); cursor:pointer; white-space:nowrap; flex-shrink:0;
  transition: all .2s ease;
}
.stage-pill-item:hover{background:hsl(var(--background) / 0.6); color:hsl(var(--foreground))}
.stage-pill-item.active{background:hsl(var(--background)); color:hsl(var(--foreground)); font-weight:600; box-shadow: 0 1px 2px rgba(0,0,0,0.06); border-color:hsl(var(--border))}
.stage-pill-item:active{transform:scale(0.97)}
.stage-popover{position:absolute; top:calc(100% + 8px); right:0; min-width:180px; padding:6px; background:hsl(var(--popover)); border:1px solid hsl(var(--border)); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.08); z-index:20; display:flex; flex-direction:column; gap:2px}
.stage-popover.hidden{display:none}
.topbar-right{display:flex; align-items:center; gap:10px; flex-shrink:0; margin-left:auto}
.topbar-search{position:relative; width:260px; max-width:32vw}
.topbar-search input{
  width:100%; height:36px; padding:0 36px 0 32px; border-radius:8px;
  border:1px solid hsl(var(--input)); background:hsl(var(--background)); font-size:13px; color:hsl(var(--foreground));
}
.topbar-search input:focus{outline:none; border-color:hsl(var(--primary)); box-shadow:0 0 0 2px hsl(var(--primary) / 0.15)}
.topbar-search .search-icon{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; opacity:.5; pointer-events:none}
.search-clear{position:absolute; right:6px; top:50%; transform:translateY(-50%); width:24px; height:24px; border-radius:8px; border:0; background:hsl(var(--muted)); color:hsl(var(--muted-foreground)); display:grid; place-items:center; cursor:pointer; font-size:14px}
.search-clear.hidden{display:none}
.search-clear:hover{background:hsl(var(--accent))}

/* 按钮 500 字重 多蓝 */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:36px; padding:8px 14px; border-radius:8px; border:1px solid hsl(var(--border));
  font-size:13px; font-weight:500; cursor:pointer; transition: all .15s ease;
}
.btn:active{transform:scale(0.97)}
.btn-primary{background:hsl(var(--primary)); color:hsl(var(--primary-foreground)); border-color:hsl(var(--primary))}
.btn-primary:hover{background:hsl(var(--primary) / 0.9)}
.btn-secondary{background:hsl(var(--card)); color:hsl(var(--foreground)); border:1px solid hsl(var(--border))}
.btn-secondary:hover{background:hsl(var(--muted) / 0.5)}
.btn-ghost{background:transparent; border:0; color:hsl(var(--muted-foreground))}
.btn-ghost:hover{background:hsl(var(--muted))}
.btn-icon{background:transparent; border:0; color:hsl(var(--muted-foreground)); transition: all .15s ease}
.btn-icon:hover{background:hsl(var(--muted)); color:hsl(var(--foreground))}
.btn-icon:active{transform:scale(0.95)}

/* 14 外密16 */
.content{padding:16px 24px 24px; max-width:1200px; width:100%; margin:0 auto}
.toolbar{display:flex; align-items:center; gap:12px; margin:0 0 12px}
.toolbar .stage-pill-wrap{flex:1; min-width:0}
.toolbar-count{font-size:12px; color:hsl(var(--muted-foreground)); margin-left:auto; flex-shrink:0; white-space:nowrap}

/* 16 行式 h16 + 6/17 多蓝多圆角阴影 · 间距不粘连 */
.list{display:flex; flex-direction:column; gap:10px; border:0; background:transparent; box-shadow:none; overflow:visible}
.list-row{
  display:flex; align-items:center; gap:12px; padding:10px 16px; min-height:64px;
  border:1px solid hsl(var(--border)); border-radius:12px; background:hsl(var(--card)); box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  cursor:pointer; transition: background .15s ease;
}
.list-row:hover{background:hsl(var(--muted) / 0.5)}
.list-row:active{background:hsl(var(--muted))}
.list-row.dragging{opacity:0.4; border:1px dashed hsl(var(--primary)); background:hsl(var(--primary) / 0.05)}
.list-row.drag-over{border-top:2px solid hsl(var(--primary))}
.drag-handle{width:20px; height:36px; display:grid; place-items:center; cursor:grab; color:hsl(var(--muted-foreground)); flex-shrink:0; border-radius:6px}
.drag-handle:hover{background:hsl(var(--muted)); color:hsl(var(--foreground))}
.drag-handle:active{cursor:grabbing}
.list-icon{width:36px; height:36px; border-radius:8px; background:hsl(var(--muted)); border:1px solid hsl(var(--border)); display:grid; place-items:center; flex-shrink:0; font-size:12px; font-weight:600; color:hsl(var(--muted-foreground))}
.list-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.list-name{font-size:14px; font-weight:500; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.list-desc{font-size:12px; color:hsl(var(--muted-foreground)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.list-tags{display:flex; gap:4px; flex-wrap:wrap; margin-top:2px}
.tag{font-size:10px; font-weight:500; padding:2px 6px; border-radius:9999px; background:hsl(var(--secondary)); color:hsl(var(--secondary-foreground)); border:1px solid hsl(var(--border))}
.badge{font-size:11px; font-weight:600; padding:3px 8px; border-radius:6px; flex-shrink:0; border:1px solid transparent}
.list-meta{font-size:11px; color:hsl(var(--muted-foreground)); text-align:right; flex-shrink:0; display:flex; flex-direction:column; gap:2px; align-items:flex-end}
.gauge{display:flex; align-items:center; gap:6px}
.gauge-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0}
.gauge-line{width:16px; height:3px; border-radius:1.5px; flex-shrink:0}
.gauge-label{font-size:11px; font-weight:600; letter-spacing:-0.01em; white-space:nowrap; margin-left:6px}
.empty{text-align:center; padding:48px 20px; color:hsl(var(--muted-foreground)); border:1px dashed hsl(var(--border)); border-radius:12px; background:hsl(var(--muted) / 0.3)}
.empty h3{font-size:16px; font-weight:600; color:hsl(var(--foreground)); margin:0 0 8px}
.empty p{font-size:13px; margin:0 0 16px}

/* 表单 */
.field{margin-bottom:12px}
.field label{display:block; font-size:11px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:hsl(var(--muted-foreground)); margin-bottom:6px}
.field input,.field textarea,.field select{
  width:100%; min-height:36px; padding:8px 10px; border-radius:8px; border:1px solid hsl(var(--input)); background:hsl(var(--background)); font-size:13px; outline:none;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:hsl(var(--ring)); box-shadow:0 0 0 2px hsl(var(--ring) / 0.15)}
.field textarea{resize:vertical; min-height:80px}

/* 全屏设置：仿 CC Switch Dialog variant fullscreen + App.tsx currentView=settings */
.overlay{position:fixed; inset:0; background:hsl(var(--background)); display:none; flex-direction:column; z-index:50; padding:0}
.overlay.show{display:flex; animation: overlayIn .2s ease}
@keyframes overlayIn{ from{opacity:0} to{opacity:1} }
.drawer{
  flex:1; width:100%; height:100%; overflow:hidden; display:flex; flex-direction:column;
  background:hsl(var(--background)); border:0; border-radius:0; box-shadow:none;
  transform: none; opacity:1; padding:0;
}
.drawer-head{flex-shrink:0; display:flex; align-items:center; height:64px; margin-top:28px; padding:0; border-bottom:1px solid hsl(var(--border)); background:hsl(var(--background)); -webkit-app-region:drag}
.drawer-head-inner{width:100%; display:flex; align-items:center; gap:16px; padding:0 24px; -webkit-app-region:drag}
.drawer-head .btn-back{flex-shrink:0; width:36px; height:36px; padding:6px; border-radius:8px; border:1px solid hsl(var(--border)); background:hsl(var(--background)); color:hsl(var(--muted-foreground)); display:grid; place-items:center; cursor:pointer; -webkit-app-region:no-drag}
.drawer-head .btn-back:hover{background:hsl(var(--muted)); color:hsl(var(--foreground)); border-color:hsl(var(--border))}
.drawer-head h2{font-size:18px; font-weight:600; letter-spacing:-0.01em; line-height:1; -webkit-app-region:no-drag; user-select:none}
.drawer-close{width:36px; height:36px; border-radius:8px; border:1px solid hsl(var(--border)); background:hsl(var(--card)); cursor:pointer; display:grid; place-items:center; font-size:18px; color:hsl(var(--muted-foreground)); -webkit-app-region:no-drag}
.drawer-close:hover{background:hsl(var(--muted))}
.drawer-body{flex:1; overflow-y:auto; overflow-x:hidden; padding:24px; padding-right:16px}
.drawer-body::-webkit-scrollbar{width:6px}
.drawer-body::-webkit-scrollbar-thumb{background:hsl(var(--border)); border-radius:9999px}
.settings-tabs{display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:4px; margin-bottom:24px; padding:4px; background:hsl(var(--muted)); border-radius:10px; border:0}
.settings-tab{min-height:34px; font-size:13px; font-weight:500; padding:8px 10px; border-radius:7px; border:0; background:transparent; color:hsl(var(--muted-foreground)); cursor:pointer; opacity:.6; transition: opacity .15s, background .15s}
.settings-tab:hover{opacity:1; background:hsl(var(--muted) / 0.6)}
.settings-tab.active{background:hsl(var(--primary)); color:hsl(var(--primary-foreground)); opacity:1; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,0.08)}
.sync-preview{font-size:11px; line-height:1.6; color:hsl(var(--muted-foreground)); background:hsl(var(--muted) / 0.5); border:1px solid hsl(var(--border)); border-radius:8px; padding:10px 12px; margin-top:8px}
.settings-stack{display:flex; flex-direction:column; gap:12px}
.settings-card{background:hsl(var(--card)); border:1px solid hsl(var(--border)); border-radius:12px; padding:16px}
.settings-card-title{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; margin:0 0 4px}
.settings-card-desc{font-size:11px; color:hsl(var(--muted-foreground)); margin:0 0 12px}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:hsl(var(--foreground)); color:hsl(var(--background)); padding:10px 16px; border-radius:9999px; font-size:12px; font-weight:500; z-index:100; opacity:0; pointer-events:none; transition: opacity .2s, transform .2s}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px)}
.ctx-item{padding:8px 12px; border-radius:6px; font-size:12px; cursor:pointer; display:flex; align-items:center; gap:8px; color:hsl(var(--foreground))}
.ctx-item:hover{background:hsl(var(--muted))}
.ctx-item.danger{color:hsl(var(--destructive))}
.hidden{display:none !important}
.prompt-card{background:hsl(var(--card)); border:1px solid hsl(var(--border)); border-radius:8px; padding:12px; margin-bottom:8px}
.prompt-card pre{background:hsl(var(--muted) / 0.5); border:1px solid hsl(var(--border)); border-radius:6px; padding:8px; font-family:ui-monospace, Menlo, monospace; font-size:12px; white-space:pre-wrap; max-height:140px; overflow:auto; margin:0 0 8px}

/* usage 板（18 轻量）· T0 磨砂 chrome（apple-style-design） */
.usage-bar{display:flex; gap:12px; align-items:center; margin-bottom:16px; padding:12px 16px; background:rgba(245,245,247,0.8); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); border:1px solid rgba(0,0,0,0.08); border-radius:12px; box-shadow:none}
.dark .usage-bar{background:rgba(22,22,23,0.8); border-color:rgba(255,255,255,0.08)}
.usage-stat{flex:1; text-align:center}
.usage-stat b{font-size:18px; font-weight:600}
.usage-stat span{font-size:11px; color:hsl(var(--muted-foreground))}
.usage-palette{display:flex; align-items:center; gap:5px; margin-left:auto; padding-left:12px}
.usage-palette span{width:10px; height:10px; border-radius:50%; flex-shrink:0}
.usage-palette em{font-style:normal; font-size:10px; color:hsl(var(--muted-foreground)); margin-left:4px; white-space:nowrap}

@media (max-width: 860px){
  .topbar{margin:6px 10px 10px; padding:0 10px; gap:8px}
  .topbar-search{width:140px; max-width:28vw}
  .stage-pill{max-width:100%}
  .content{padding:12px 12px 24px}
  .drawer{width:100%}
}
@media (max-width: 560px){
  .topbar-left .topbar-meta{display:none}
  .topbar-search{width:120px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>
<a href="#main" class="skip-link">跳至主内容</a>
<div class="drag-bar" data-tauri-drag-region></div>
<div class="app-shell">
  <div class="main" id="main">
    <div class="topbar" id="topbar">
      <div class="topbar-left" id="topbarBrand" title="查看产品介绍 — 点击跳转">
        <div class="topbar-title" id="topbarTitle">Agent Workbench</div>
        <span class="topbar-meta" id="topbarMeta"></span>
      </div>
      <div class="topbar-right">
        <div class="topbar-search">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16 16l4 4"/></svg>
          <input type="text" id="searchInput" placeholder="搜索项目…" aria-label="搜索">
          <button class="search-clear hidden" id="searchClear" aria-label="清除">×</button>
        </div>
        <button class="btn btn-primary" id="addProjectBtn" title="新建项目" aria-label="新建项目" style="min-height:36px; padding:8px 14px; border-radius:8px; gap:6px; white-space:nowrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="14" height="14"><path d="M12 5v14M5 12h14"/></svg><span id="addProjectLabel">新建</span></button>
        <button class="btn btn-icon" id="importJsonBtn" title="导入本机项目" aria-label="导入本机项目" style="width:36px; height:36px; padding:0; border-radius:8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>

// ===== i18n（对标 CC Switch src/i18n 4 语言 立即预览+持久）=====
const I18N = {

function getInitialLanguage(){
  try{
    const s=localStorage.getItem('language');
    if(s==='zh'||s==='zh-TW'||s==='en'||s==='ja') return s;
  }catch(e){}
  const nav=(navigator.language||'').toLowerCase();
  if(nav.startsWith('zh-tw')||nav.startsWith('zh-hk')||nav.startsWith('zh-mo')||nav.startsWith('zh-hant')) return 'zh-TW';
  if(nav.startsWith('zh')) return 'zh';
  if(nav.startsWith('ja')) return 'ja';
  if(nav.startsWith('en')) return 'en';
  return 'zh';
}
let currentLang=getInitialLanguage();
function t(path){
  const parts=path.split('.');
  let cur=I18N[currentLang];
  for(const p of parts){ if(cur && cur[p]!==undefined) cur=cur[p]; else return path; }
  return typeof cur==='string'?cur:path;
}
function setLanguage(lang){
  if(!['zh','zh-TW','en','ja'].includes(lang)) return;
  localStorage.setItem('language', lang);
  currentLang=lang;
  document.documentElement.lang=lang;
  render();
  renderSettingsDrawer();
  showToast(t('settings.language')+': '+lang);
}

// ===== Theme（对标 CC Switch theme-provider  light/dark/system 立即生效）=====
function getInitialTheme(){
  try{
    const s=localStorage.getItem('cc-switch-theme')||localStorage.getItem('workbench-theme');
    if(s==='light'||s==='dark'||s==='system') return s;
  }catch(e){}
  return 'system';
}
let currentTheme=getInitialTheme();
function applyTheme(theme){
  if(!['light','dark','system'].includes(theme)) return;
  localStorage.setItem('cc-switch-theme', theme);
  localStorage.setItem('workbench-theme', theme);
  currentTheme=theme;
  const root=document.documentElement;
  root.classList.remove('light','dark');
  if(theme==='system'){
    const isDark=window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.classList.add(isDark?'dark':'light');
    // 通知 Tauri 原生标题栏跟随系统（与 CC 同步）
    try{ if(window.__TAURI__ && window.__TAURI__.invoke) window.__TAURI__.invoke('set_window_theme',{theme:'system'}).catch(()=>{}); }catch(e){}
  } else {
    root.classList.add(theme);
    try{ if(window.__TAURI__ && window.__TAURI__.invoke) window.__TAURI__.invoke('set_window_theme',{theme}).catch(()=>{}); }catch(e){}
  }
}
applyTheme(currentTheme);
if(window.matchMedia){
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  mq.addEventListener('change', ()=>{
    if(currentTheme==='system') applyTheme('system');
  });
}

function loadSettings(){ try{ return JSON.parse(localStorage.getItem(SETTINGS_KEY)||'null'); }catch(e){ return null; } }
function saveSettings(s){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }
function hasSyncSettings(){ return !!(settings && settings.url && settings.token); }
function clearSyncSettings(){ settings=null; localStorage.removeItem(SETTINGS_KEY); setSyncStatus('idle'); }
function cacheLocally(projects){ localStorage.setItem(CACHE_KEY, JSON.stringify({projects, cachedAt:new Date().toISOString()})); try{ dbSaveProjects(projects).catch(()=>{}); }catch(e){} }
function readCache(){ try{ return JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){ return null; } }
// ---- W1: Tauri DB bridge（对标 CC Switch Database::* 写透 + WAL） ----
const SYNC_STATE_KEY='workbench-sync-state';
function loadSyncState(){ try{ return JSON.parse(localStorage.getItem(SYNC_STATE_KEY)||'null')||{}; }catch(e){ return {}; } }
function saveSyncState(s){ localStorage.setItem(SYNC_STATE_KEY, JSON.stringify(s)); }
let syncState=loadSyncState();
function tauriInvoke(cmd, args){ 
  try{
    if(window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke) return window.__TAURI_INTERNALS__.invoke(cmd, args);
    if(window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) return window.__TAURI__.core.invoke(cmd, args);
    if(window.__TAURI__ && window.__TAURI__.invoke) return window.__TAURI__.invoke(cmd, args);
    if(window.__TAURI_IPC__ && window.__TAURI_IPC__.invoke) return window.__TAURI_IPC__.invoke(cmd, args);
  }catch(e){ console.warn('[tauriInvoke] try fail', e); }
  return Promise.reject(new Error('tauri not available'));
}
function rep(msg){ try{ if(dbAvailable()) tauriInvoke('report_frontend', {msg}).catch(()=>{}); }catch(e){} }
function dbAvailable(){ 
  try{
    if(window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke) return true;
    if(window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) return true;
    if(window.__TAURI__ && window.__TAURI__.invoke) return true;
    if(window.__TAURI_IPC__ && window.__TAURI_IPC__.invoke) return true;
  }catch(e){}
  return false;
}
async function dbGetProjects(){ if(!dbAvailable()) return null; try{ return await tauriInvoke('get_projects'); }catch(e){ console.warn('dbGet failed',e); return null; } }
async function dbSaveProjects(projects){ if(!dbAvailable()) return; try{ await tauriInvoke('save_projects', {projects}); }catch(e){ console.warn('dbSave failed',e); } }
async function dbBackupNow(note){ if(!dbAvailable()) return null; try{ return await tauriInvoke('backup_now', {note}); }catch(e){ console.warn('backup failed',e); return null; } }
async function dbListBackups(){ if(!dbAvailable()) return []; try{ return await tauriInvoke('list_backups'); }catch(e){ return []; } }
async function safetyBackup(note){ try{ const id=await dbBackupNow(note||'auto'); if(id) showToast('已备份 '+id); return id; }catch(e){ return null; } }
// ---- W2: Proxy 真服务（对标 CC Switch proxyApi 2s 轮询） ----
async function proxyGetStatus(){ if(!dbAvailable()) return {is_running:false, address:'', port:0, upstream: localStorage.getItem('proxy-upstream')||''}; try{ return await tauriInvoke('get_proxy_status'); }catch(e){ return {is_running: localStorage.getItem('proxy-enabled')==='1', address: '127.0.0.1:19840', port:19840, upstream: localStorage.getItem('proxy-upstream')||''}; } }
async function proxyStart(upstream){ if(!dbAvailable()){ localStorage.setItem('proxy-enabled','1'); localStorage.setItem('proxy-upstream', upstream||''); return {is_running:true, upstream}; } try{ return await tauriInvoke('start_proxy', {upstream: upstream||''}); }catch(e){ throw e; } }
async function proxyStop(){ if(!dbAvailable()){ localStorage.setItem('proxy-enabled','0'); return; } try{ return await tauriInvoke('stop_proxy'); }catch(e){ throw e; } }
async function proxySetUpstream(upstream){ if(!dbAvailable()){ localStorage.setItem('proxy-upstream', upstream||''); return; } try{ return await tauriInvoke('set_proxy_upstream', {upstream}); }catch(e){ localStorage.setItem('proxy-upstream', upstream); } }
async function showConflictDialog(remoteCount, localCount, remoteAt){
  return new Promise(resolve=>{
    const overlay=document.getElementById('overlay');
    const drawer=document.getElementById('drawer');
    const prev=drawer.innerHTML;
    drawer.innerHTML=`
      <div class="drawer-head" data-tauri-drag-region><div class="drawer-head-inner" data-tauri-drag-region style="justify-content:space-between"><h2>同步冲突</h2><button class="drawer-close" id="conflictClose" aria-label="关闭">×</button></div></div>
      <div class="drawer-body">
        <div class="sync-preview" style="background:hsl(var(--destructive) / 0.08); border-color:hsl(var(--destructive) / 0.2); color:hsl(var(--destructive));">检测到本地与云端均有未同步的修改（本地 ${localCount} 项 / 云端 ${remoteCount} 项，云端更新于 ${remoteAt?new Date(remoteAt).toLocaleString('zh-CN'):'未知'}）。直接覆盖会导致一端丢失。</div>
        <div style="display:flex; flex-direction:column; gap:8px; margin-top:16px;">
          <button class="btn btn-primary" id="conflictUseRemote">使用云端覆盖本地（先备份本地）</button>
          <button class="btn btn-secondary" id="conflictKeepLocal">保留本地并推送到云端</button>
          <button class="btn btn-secondary" id="conflictCancel">取消，稍后手动处理</button>
        </div>
        <div style="font-size:11px; color:hsl(var(--muted-foreground)); margin-top:12px;">提示：任一操作前会自动创建 safety backup（对标 CC Switch backupsApi.createDbBackup + backupRetainCount）。</div>
      </div>`;
    openOverlay();
    const close=(val)=>{ closeOverlay(); setTimeout(()=>{ drawer.innerHTML=prev; },220); resolve(val); };
    document.getElementById('conflictClose').addEventListener('click',()=>close('cancel'));
    document.getElementById('conflictUseRemote').addEventListener('click',()=>close('remote'));
    document.getElementById('conflictKeepLocal').addEventListener('click',()=>close('local'));
    document.getElementById('conflictCancel').addEventListener('click',()=>close('cancel'));
    document.getElementById('overlay').addEventListener('click', function handler(e){ if(e.target.id==='overlay'){ document.getElementById('overlay').removeEventListener('click', handler); close('cancel'); } }, {once:true});
  });
}
function apiUrl(path){ return settings.url.replace(/\/+$/,'')+path; }
async function apiGet(){ if(!hasSyncSettings()) throw new Error('no sync'); const r=await fetch(apiUrl('/api/state'),{headers:{'X-Sync-Token':settings.token}}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function apiPut(projects){ if(!hasSyncSettings()) throw new Error('no sync'); const r=await fetch(apiUrl('/api/state'),{method:'PUT',headers:{'Content-Type':'application/json','X-Sync-Token':settings.token},body:JSON.stringify({projects})}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function pullFromServer(showToastOnSuccess){
  if(!hasSyncSettings()){ setSyncStatus('idle'); return; }
  setSyncStatus('syncing');
  try{
    const data=await apiGet();
    const remoteProjects=data.projects||[];
    const remoteAt=data.updatedAt||null;
    const localDirty=syncState.dirty===true;
    const lastSyncedAt=syncState.lastSyncedAt||null;
    const conflict=localDirty && lastSyncedAt && remoteAt && remoteAt!==lastSyncedAt;
    if(conflict){
      const choice=await showConflictDialog(remoteProjects.length, state.projects.length, remoteAt);
      if(choice==='remote'){
        await safetyBackup('conflict-remote-overwrites-local');
        state.projects=remoteProjects; state.loaded=true; cacheLocally(state.projects); await dbSaveProjects(state.projects);
        syncState.lastSyncedAt=remoteAt; syncState.dirty=false; saveSyncState(syncState);
        setSyncStatus('ok', remoteAt); render(); if(showToastOnSuccess) showToast('已使用云端覆盖本地');
        return;
      } else if(choice==='local'){
        await safetyBackup('conflict-local-pushes');
        setSyncStatus('syncing');
        try{ const res=await apiPut(state.projects); syncState.lastSyncedAt=res.updatedAt||new Date().toISOString(); syncState.dirty=false; saveSyncState(syncState); setSyncStatus('ok', syncState.lastSyncedAt); showToast('已将本地推送到云端'); }catch(e){ setSyncStatus('offline'); showToast('推送失败，已保留本地'); }
        return;
      } else {
        setSyncStatus('offline'); showToast('已取消同步，请手动处理'); return;
      }
    }
    // 无冲突：直接覆盖本地，但先备份
    if(localDirty) await safetyBackup('pull-overwrites-dirty');
    state.projects=remoteProjects; state.loaded=true; cacheLocally(state.projects); await dbSaveProjects(state.projects);
    syncState.lastSyncedAt=remoteAt; syncState.dirty=false; saveSyncState(syncState);
    setSyncStatus('ok', remoteAt); render(); if(showToastOnSuccess) showToast('已同步最新数据');
  }catch(e){
    const dbData=await dbGetProjects();
    if(dbData && Array.isArray(dbData) && dbData.length){ state.projects=dbData; state.loaded=true; cacheLocally(state.projects); }
    else {
      const cache=readCache();
      if(cache) { state.projects=cache.projects; state.loaded=true; }
      else if(!state.loaded){ state.projects=[]; state.loaded=true; }
    }
    setSyncStatus('offline'); render();
  }
}
function scheduleAutoPush(){ clearTimeout(pushTimer); pushTimer=setTimeout(pushToServer,500); }
async function pushToServer(){
  cacheLocally(state.projects);
  try{ await dbSaveProjects(state.projects); }catch(e){}
  syncState.dirty=true; syncState.lastLocalAt=new Date().toISOString(); saveSyncState(syncState);
  if(!hasSyncSettings()){ setSyncStatus('idle'); return; }
  setSyncStatus('syncing');
  try{ const res=await apiPut(state.projects); syncState.lastSyncedAt=res.updatedAt||new Date().toISOString(); syncState.dirty=false; saveSyncState(syncState); setSyncStatus('ok', res.updatedAt); }
  catch(e){ setSyncStatus('offline'); showToast('同步失败，已保存在本地（SQLite+WAL），联网后会自动重试'); }
}
async function saveData(){ scheduleAutoPush(); }
function setSyncStatus(status, updatedAt){
  const el=document.getElementById('usageProxy');
  if(el){
    if(status==='syncing') el.textContent='⟳';
    else if(status==='ok') el.textContent='●';
    else if(status==='offline') el.textContent='○';
    else el.textContent='●';
    el.style.color=status==='ok'?'#059669':status==='offline'?'#d97706':'hsl(var(--muted-foreground))';
  }
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer=setTimeout(()=>t.classList.remove('show'),2200);
}
function openSyncSettings(prefillError){
  settingsTab=hasSyncSettings()?'sync':'general';
  renderSettingsDrawer(prefillError); openOverlay();
}
function renderSettingsDrawer(prefillError){
  const drawer=document.getElementById('drawer');
  const hasSync=hasSyncSettings();
  const cache=readCache(); const localCount=(cache?.projects||state.projects||[]).length;
  // CC 同款：grid 6列 glass + motion
  drawer.innerHTML=`
    <div class="drawer-head" data-tauri-drag-region>
      <div class="drawer-head-inner" data-tauri-drag-region>
        <button class="btn-back" id="settingsBack" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></button>
        <h2>${t('common.settings')}</h2>
      </div>
    </div>
    <div class="drawer-body">
      <div class="settings-tabs" style="grid-template-columns:repeat(auto-fit, minmax(120px, 1fr))">
        <button class="settings-tab ${settingsTab==='general'?'active':''}" data-tab="general" style="background:${settingsTab==='general'?'hsl(var(--primary))':'transparent'}; color:${settingsTab==='general'?'hsl(var(--primary-foreground))':'hsl(var(--muted-foreground))'}; box-shadow:${settingsTab==='general'?'0 1px 2px rgba(0,0,0,0.08)':''}">${t('common.general')}</button>

function relTime(iso){
  if(!iso) return '';
  const diff=Date.now()-new Date(iso).getTime();
  const min=Math.floor(diff/60000);
  if(min<1) return '刚刚';
  if(min<60) return min+' 分钟前';
  const hr=Math.floor(min/60);
  if(hr<24) return hr+' 小时前';
  const day=Math.floor(hr/24);
  if(day<30) return day+' 天前';
  return new Date(iso).toLocaleDateString('zh-CN');
}

let _stageVisibleCount=6;
function renderStagePill(){
  const pill=document.getElementById('stagePill');
  const popover=document.getElementById('stageMorePopover');
  const wrap=document.getElementById('stagePillWrap');
  if(!pill||!wrap) return;
  const slot=wrap.parentElement;
  const stages=[{key:'all',label:t('stages.all'),color:'hsl(var(--muted-foreground))',bg:'hsl(var(--muted))'},...STAGES.map(s=>({key:s.key,label:t('stages.'+s.key),color:s.color,bg:s.bg})),{key:'paused',label:t('stages.paused'),color:'#86868b',bg:'hsl(var(--muted))'}];
  const total=stages.length;
  if(_stageVisibleCount>total) _stageVisibleCount=total;
  if(_stageVisibleCount<1) _stageVisibleCount=1;
  let visibleCount=Math.min(_stageVisibleCount, total);
  let visibleList=stages.slice(0, Math.max(1, visibleCount));
  if(!visibleList.some(s=>s.key===state.filterStage)){
    const active=stages.find(s=>s.key===state.filterStage);
    if(active && visibleList.length>0) visibleList[visibleList.length-1]=active;
  }
  const overflowSet=new Set(visibleList.map(s=>s.key));
  let overflowList=stages.filter(s=> !overflowSet.has(s.key));
  pill.innerHTML='';
  popover.innerHTML='';
  popover.classList.add('hidden');
  function makeBtn(s){
    const isActive=state.filterStage===s.key;
    const b=document.createElement('button');
    b.className='stage-pill-item'+(isActive?' active':'');
    b.dataset.stage=s.key;
    b.style.display='inline-flex';
    b.style.alignItems='center';
    b.style.gap='6px';
    const dot=document.createElement('span');
    dot.style.cssText=`width:6px;height:6px;border-radius:50%;background:${s.color};flex-shrink:0;display:inline-block${isActive?';box-shadow:0 0 0 2px '+s.color+'33':''}`;
    const label=document.createElement('span');
    label.textContent=s.label;
    b.append(dot,label);
    if(isActive){
      b.style.background=s.bg;
      b.style.color=s.color;
      b.style.borderColor=s.color+'22';
      b.style.fontWeight='600';
    }
    b.addEventListener('click',()=>{ state.filterStage=s.key; state.page=1; render(); closeMore(); });
    return b;
  }
  visibleList.forEach(s=> pill.appendChild(makeBtn(s)));
  let moreBtn=null;
  if(overflowList.length>0){
    moreBtn=document.createElement('button');
    moreBtn.className='stage-pill-item stage-more-trigger';
    moreBtn.textContent='⋯';
    moreBtn.setAttribute('aria-label','更多阶段');
    moreBtn.addEventListener('click',(e)=>{ e.stopPropagation(); popover.classList.toggle('hidden'); });
    pill.appendChild(moreBtn);
    overflowList.forEach(s=> popover.appendChild(makeBtn(s)));
  }
  function closeMore(){ if(popover) popover.classList.add('hidden'); }
  function compute(){
    const sSlot=wrap.parentElement;
    const sPill=document.getElementById('stagePill');
    if(!sSlot||!sPill) return;
    const sample=sPill.querySelector('.stage-pill-item');
    if(!sample) return;
    const itemW=sample.offsetWidth;
    if(itemW<=0) return;
    const st=getComputedStyle(sPill);
    const gap=parseFloat(st.columnGap||st.gap)||4;
    const pad=(parseFloat(st.paddingLeft)||0)+(parseFloat(st.paddingRight)||0);
    const available=sSlot.clientWidth;
    const widthAll=pad + total*itemW + (total-1)*gap;
    let next;
    if(widthAll <= available) next=total;
    else {
      const fit=Math.floor((available - pad - itemW)/(itemW+gap));
      next=Math.max(1, Math.min(total-1, fit));
    }
    if(next!==_stageVisibleCount){
      _stageVisibleCount=next;
      requestAnimationFrame(()=> renderStagePill());
    }
  }
  requestAnimationFrame(compute);
  if(!wrap._ro){
    if(typeof ResizeObserver!=='undefined'){
      try{
        const ro=new ResizeObserver(()=> compute());
        ro.observe(slot);
        wrap._ro=ro;
      }catch(e){}
    }
    window.addEventListener('resize', compute);
  }
  if(!wrap._outside){
    document.addEventListener('click',(e)=>{ if(!wrap.contains(e.target)) closeMore(); });
    wrap._outside=true;
  }
}
function debounce(fn, ms){ let t=null; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms); }; }
function highlight(text, q){
  if(!q) return esc(text);
  const idx=text.toLowerCase().indexOf(q.toLowerCase());
  if(idx<0) return esc(text);
  const before=esc(text.slice(0,idx));
  const match=esc(text.slice(idx, idx+q.length));
  const after=esc(text.slice(idx+q.length));
  return `${before}<mark style="background:hsl(48 96% 53% / 0.3); padding:0 2px; border-radius:2px">${match}</mark>${after}`;
}
function filteredProjects(){

      if(!state.search) return true;
      const q=state.search.toLowerCase();
      return p.name.toLowerCase().includes(q)
        || (p.description||'').toLowerCase().includes(q)
        || (p.tags||[]).some(t=>t.toLowerCase().includes(q))
        || (p.category||'').toLowerCase().includes(q)

        || (p.prompts||[]).some(pr=> (pr.title||'').toLowerCase().includes(q) || (pr.content||'').toLowerCase().includes(q));
    })
    .sort((a,b)=> ( (a.sort_index||0)-(b.sort_index||0) ) || (new Date(b.updatedAt)-new Date(a.updatedAt)) );
}
function simpleLineDiff(a,b){
  const al=a.split('\n'), bl=b.split('\n');
  const max=Math.max(al.length, bl.length);
  let out='';
  for(let i=0;i<max;i++){
    const la=al[i]??''; const lb=bl[i]??'';
    if(la===lb) out+=`<div style="background:hsl(var(--muted)/0.3); padding:2px 6px; font-family:ui-monospace,Menlo,monospace; font-size:11px">${esc(la)||' '}</div>`;
    else {
      if(la!==undefined && la!=='') out+=`<div style="background:hsl(0 84% 95%); color:hsl(0 84% 35%); padding:2px 6px; font-family:ui-monospace,Menlo,monospace; font-size:11px; border-left:3px solid hsl(var(--destructive))">- ${esc(la)}</div>`;
      if(lb!==undefined && lb!=='') out+=`<div style="background:hsl(142 76% 92%); color:#166534; padding:2px 6px; font-family:ui-monospace,Menlo,monospace; font-size:11px; border-left:3px solid #059669">+ ${esc(lb)}</div>`;

function renderGrid(){
  const el=document.getElementById('gridArea');
  const list=filteredProjects();
  const toolbarCount=document.getElementById('toolbarCount');
  const topbarMeta=document.getElementById('topbarMeta');
  const total=state.projects.length;
  if(topbarMeta) topbarMeta.textContent=(state.filterStage==='all'?'全部':(stageInfo(state.filterStage).label||'全部'))+' · '+total+' 个项目';
  if(toolbarCount) toolbarCount.textContent=list.length+' / '+total;
  if(state.projects.length===0){
    el.innerHTML=`<div class="empty"><h3>${t('app.noProjects')}</h3><p>把你正在构思或搭建的第一个 Agent 项目加进来，或点右上“${t('app.import')}”拉取本机扫描结果。</p><button class="btn btn-primary" id="emptyAddBtn">${t('app.addProject')}</button></div>`;
    document.getElementById('emptyAddBtn').addEventListener('click',()=>openCreateModal());
    return;
  }
  if(list.length===0){
    el.innerHTML=`<div class="empty"><h3>${t('app.noMatch')}</h3><p>试试换个筛选条件或搜索词。</p></div>`;
    return;
  }
  // 分页 · W3（对标 CC 虚拟化/分页）
  const totalPages=Math.max(1, Math.ceil(list.length / state.pageSize));
  if(state.page>totalPages) state.page=totalPages;
  const start=(state.page-1)*state.pageSize;
  const pageList=list.slice(start, start+state.pageSize);
  // 16 行式 h16 ListItemRow + 分页条
  el.innerHTML=`<div class="list">${pageList.map(rowHtml).join('')}</div>` + (totalPages>1 ? `<div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; padding:10px 12px; background:hsl(var(--card)); border:1px solid hsl(var(--border)); border-radius:8px; font-size:12px"><div>第 ${state.page} / ${totalPages} 页 · 共 ${list.length} 项 · 显示 ${pageList.length} · 拖拽在全列表排序</div><div style="display:flex; gap:6px; align-items:center"><button class="btn btn-secondary" id="prevPage" ${state.page<=1?'disabled':''} style="min-height:32px; padding:6px 12px">上一页</button><select id="pageSizeSel" style="min-height:32px; border-radius:8px; border:1px solid hsl(var(--border)); padding:6px 8px"><option value="10" ${state.pageSize===10?'selected':''}>10/页</option><option value="20" ${state.pageSize===20?'selected':''}>20/页</option><option value="50" ${state.pageSize===50?'selected':''}>50/页</option></select><button class="btn btn-secondary" id="nextPage" ${state.page>=totalPages?'disabled':''} style="min-height:32px; padding:6px 12px">下一页</button></div></div>` : '');
  // 分页事件
  const prevBtn=document.getElementById('prevPage');
  const nextBtn=document.getElementById('nextPage');
  const sizeSel=document.getElementById('pageSizeSel');
  if(prevBtn) prevBtn.addEventListener('click',()=>{ if(state.page>1){ state.page--; render(); }});
  if(nextBtn) nextBtn.addEventListener('click',()=>{ if(state.page<totalPages){ state.page++; render(); }});
  if(sizeSel) sizeSel.addEventListener('change',(e)=>{ state.pageSize=parseInt(e.target.value,10); state.page=1; render(); });
  let dragSrcId=null;
  pageList.forEach(p=>{
    const row=document.getElementById('row-'+p.id);
    if(row){
      row.addEventListener('click',(e)=>{
        if(row.classList.contains('dragging')) return;
        if(e.target.closest('.drag-handle')) return;
        openDetail(p.id);
      });
      row.addEventListener('keydown',(e)=>{ if(e.key==='Enter') openDetail(p.id); });
      row.addEventListener('contextmenu',(e)=>{ e.preventDefault(); showCtxMenu(e.clientX, e.clientY, p.id); });
      row.addEventListener('dragstart',(e)=>{
        dragSrcId=p.id;
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed='move';
        e.dataTransfer.setData('text/plain', p.id);
        setTimeout(()=> row.style.opacity='0.4', 0);
      });
      row.addEventListener('dragend',()=>{
        dragSrcId=null;
        row.classList.remove('dragging');
        row.style.opacity='';
        document.querySelectorAll('.list-row.drag-over').forEach(el=>el.classList.remove('drag-over'));
      });
      row.addEventListener('dragover',(e)=>{
        e.preventDefault();
        e.dataTransfer.dropEffect='move';
        if(dragSrcId && dragSrcId!==p.id){
          row.classList.add('drag-over');
        }
      });
      row.addEventListener('dragleave',()=> row.classList.remove('drag-over'));
      row.addEventListener('drop',(e)=>{
        e.preventDefault();
        row.classList.remove('drag-over');
        const srcId=dragSrcId || e.dataTransfer.getData('text/plain');
        const dstId=p.id;
        if(!srcId || srcId===dstId) return;
        // 重排：以当前过滤后列表为基准，计算新顺序
        const srcIdx=list.findIndex(x=>x.id===srcId);
        const dstIdx=list.findIndex(x=>x.id===dstId);
        if(srcIdx<0 || dstIdx<0) return;
        const newList=list.slice();
        const [moved]=newList.splice(srcIdx,1);
        newList.splice(dstIdx,0,moved);
        // 将 newList 的顺序写回 state.projects 的 sort_index
        // 保留未在过滤列表中的项目在后
        const orderMap=new Map(newList.map((x,i)=>[x.id,i]));
        state.projects.forEach(proj=>{
          if(orderMap.has(proj.id)) proj.sort_index=orderMap.get(proj.id);
          else proj.sort_index=9999;
          proj.updatedAt=new Date().toISOString();
        });
        // 按 sort_index 重排 state.projects 保持稳定
        state.projects.sort((a,b)=> (a.sort_index||0)-(b.sort_index||0) || new Date(b.updatedAt)-new Date(a.updatedAt));
        saveData();
        render();
        showToast('已更新排序');
      });
    }
  });
}
function showCtxMenu(x,y, projectId){
  const menu=document.getElementById('ctxMenu');
  const p=state.projects.find(x=>x.id===projectId);
  if(!p || !menu) return;
  menu.innerHTML=`
    <div class="ctx-item" data-act="edit" data-id="${p.id}">✎ 编辑</div>
    <div class="ctx-item" data-act="duplicate" data-id="${p.id}">⧉ 复制项目</div>
    <div class="ctx-item" data-act="copy" data-id="${p.id}">⎘ 复制名称</div>
    <div style="height:1px; background:hsl(var(--border)); margin:4px 0"></div>
    <div class="ctx-item danger" data-act="delete" data-id="${p.id}">🗑 删除</div>
  `;
  menu.style.left=Math.min(x, window.innerWidth-170)+'px';
  menu.style.top=Math.min(y, window.innerHeight-160)+'px';
  menu.classList.remove('hidden');
  menu.querySelectorAll('.ctx-item').forEach(el=>{
    el.addEventListener('click',()=>{
      const act=el.dataset.act;
      const id=el.dataset.id;
      hideCtxMenu();
      if(act==='edit') openDetail(id);
      else if(act==='duplicate'){
        const src=state.projects.find(x=>x.id===id);
        if(src){
          const now=new Date().toISOString();
          const copy={...JSON.parse(JSON.stringify(src)), id:uid('p'), name:src.name+' 副本', createdAt:now, updatedAt:now, sort_index:(src.sort_index||0)+0.5, prompts:(src.prompts||[]).map(pr=>({...pr, id:uid('pr')}))};
          state.projects.push(copy);
          state.projects.sort((a,b)=> (a.sort_index||0)-(b.sort_index||0) || new Date(b.updatedAt)-new Date(a.updatedAt));
          state.projects.forEach((proj,i)=> proj.sort_index=i);
          saveData(); render(); showToast('已复制');
        }
      }
      else if(act==='copy'){ navigator.clipboard.writeText(p.name).then(()=>showToast('已复制名称')); }
      else if(act==='delete'){ deleteProject(id); }
    });
  });
}

function showPromptDiff(projectId, aId, bId){
  const p=state.projects.find(x=>x.id===projectId);
  const a=(p.prompts||[]).find(x=>x.id===aId);
  const b=(p.prompts||[]).find(x=>x.id===bId);
  if(!a||!b) return;
  let prev=document.getElementById('diffResult');
  if(prev) prev.remove();
  const diffSlot=document.getElementById('diffSlot');
  const html=`<div id="diffResult" style="border:1px solid hsl(var(--border)); border-radius:8px; overflow:hidden; margin-top:8px">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 10px; background:hsl(var(--muted)); border-bottom:1px solid hsl(var(--border))">
      <span style="font-size:12px; font-weight:600">v${a.version} ${esc(a.title)} ↔ v${b.version} ${esc(b.title)}</span>
      <button class="btn btn-secondary" id="diffClose" style="min-height:28px; font-size:11px">关闭</button>
    </div>
    <div style="max-height:280px; overflow:auto; border-top:1px solid hsl(var(--border))">${simpleLineDiff(a.content, b.content)}</div>
    <div style="display:flex; gap:6px; padding:8px; background:hsl(var(--card))">
      <button class="btn btn-primary" id="rollbackA" style="flex:1; min-height:32px; font-size:12px">将 v${a.version} 回滚为新版</button>
      <button class="btn btn-secondary" id="rollbackB" style="flex:1; min-height:32px; font-size:12px">将 v${b.version} 回滚为新版</button>
    </div>
  </div>`;
  diffSlot.insertAdjacentHTML('beforeend', html);
  document.getElementById('diffClose').addEventListener('click',()=> document.getElementById('diffResult').remove());
  document.getElementById('rollbackA').addEventListener('click',()=> rollbackPrompt(projectId, aId));
  document.getElementById('rollbackB').addEventListener('click',()=> rollbackPrompt(projectId, bId));
}
function rollbackPrompt(projectId, promptId){
  const p=state.projects.find(x=>x.id===projectId);
  const src=(p.prompts||[]).find(x=>x.id===promptId);
  if(!src) return;
  if(!confirm(`将「${src.title} v${src.version}」复制为新版本？`)) return;
  const now=new Date().toISOString();
  const nextVersion=(Math.max(0,...p.prompts.map(pr=>pr.version))+1);
  p.prompts.push({id:uid('pr'), title: src.title+' (回滚)', content: src.content, version: nextVersion, notes: `回滚自 v${src.version} · ${src.title}`, isCurrent:false, createdAt:now});
  p.updatedAt=now;
  saveData();
  renderDetail(p);
  showToast('已回滚为 v'+nextVersion);
}
function renderPromptList(p){
  const prompts=(p.prompts||[]).slice().sort((a,b)=>b.version-a.version);
  if(prompts.length===0) return `<p style="color:hsl(var(--muted-foreground));font-size:13px; padding:14px; background:hsl(var(--muted) / 0.5); border:1px solid hsl(var(--border)); border-radius:8px;">还没有添加 Prompt。点“添加 Prompt”开始记录第一版。</p>`;
  if(prompts.length>=2){
    // diff 选择条
    const opts=prompts.map(pr=>`<option value="${pr.id}">v${pr.version} · ${esc(pr.title)}</option>`).join('');
    // 放在首卡前 via extra header? 直接拼在顶部
  }
  return prompts.map(pr=>`
    <div class="prompt-card" data-prompt-id="${pr.id}">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;">
        <div style="font-size:13px; font-weight:600;">${esc(pr.title)}${pr.isCurrent?'<span style="margin-left:6px;font-size:10px;font-weight:600;padding:3px 7px;border-radius:9999px;background:hsl(142 76% 92%);color:#059669; border:1px solid hsl(142 76% 85%);">当前版本</span>':''}</div>
        <span style="font-size:11px;color:hsl(var(--muted-foreground));">v${pr.version} · ${relTime(pr.createdAt)}</span>
      </div>
      <pre>${esc(pr.content)}</pre>
      ${pr.notes?`<div style="font-size:12px;color:hsl(var(--muted-foreground));margin-bottom:8px;">备注：${esc(pr.notes)}</div>`:''}
      <div style="display:flex;gap:6px;flex-wrap:wrap;">
        ${!pr.isCurrent?`<button class="btn btn-secondary" data-act="current" style="min-height:32px; font-size:12px; padding:6px 10px;">设为当前</button>`:''}
        <button class="btn btn-secondary" data-act="edit" style="min-height:32px; font-size:12px; padding:6px 10px;">编辑</button>
        <button class="btn btn-secondary" data-act="diff" style="min-height:32px; font-size:12px; padding:6px 10px;">↔ 对比</button>
        <button class="btn btn-secondary" data-act="rollback" style="min-height:32px; font-size:12px; padding:6px 10px;">⎌ 回滚为新版</button>
        <button class="btn btn-secondary" data-act="delete" style="min-height:32px; font-size:12px; padding:6px 10px; color:hsl(var(--destructive));">删除</button>
      </div>
    </div>`).join('');
}
function renderDiffBar(p){
  const prompts=(p.prompts||[]).slice().sort((a,b)=>b.version-a.version);
  if(prompts.length<2) return '';
  const opts=prompts.map(pr=>`<option value="${pr.id}">${esc('v'+pr.version+' · '+pr.title)}</option>`).join('');
  return `
    <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:8px 10px; background:hsl(var(--muted)/0.5); border:1px solid hsl(var(--border)); border-radius:8px; margin-bottom:8px">
      <span style="font-size:11px; font-weight:600; color:hsl(var(--muted-foreground))">版本对比：</span>
      <select id="diffA" style="flex:1; min-height:32px; border-radius:8px; border:1px solid hsl(var(--border)); padding:4px 8px; font-size:12px">${opts}</select>
      <span style="font-size:12px; color:hsl(var(--muted-foreground))">↔</span>
      <select id="diffB" style="flex:1; min-height:32px; border-radius:8px; border:1px solid hsl(var(--border)); padding:4px 8px; font-size:12px">${opts}</select>
      <button class="btn btn-primary" id="diffGo" style="min-height:32px; font-size:12px">对比</button>
      <button class="btn btn-secondary" id="diffClear" style="min-height:32px; font-size:12px">清除</button>
    </div>`;
}
function bindPromptListEvents(projectId){
  const container=document.getElementById('promptList');
  container.querySelectorAll('.prompt-card').forEach(card=>{
    const promptId=card.dataset.promptId;
    card.querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const act=btn.dataset.act;
        if(act==='current') setCurrentPrompt(projectId,promptId);
        else if(act==='edit'){ const p=state.projects.find(x=>x.id===projectId); showPromptForm(projectId,p.prompts.find(x=>x.id===promptId)); }
        else if(act==='delete') deletePrompt(projectId,promptId);
        else if(act==='diff'){ // 选中该版为 A，另一版为当前最新
          const p=state.projects.find(x=>x.id===projectId);
          const other=(p.prompts||[]).slice().sort((a,b)=>b.version-a.version).find(x=>x.id!==promptId);
          if(!other){ showToast('至少需要两版才能对比'); return; }
          const diffA=document.getElementById('diffA');
          const diffB=document.getElementById('diffB');
          if(diffA && diffB){ diffA.value=promptId; diffB.value=other.id; }
          showPromptDiff(projectId, promptId, other.id);
        }
        else if(act==='rollback') rollbackPrompt(projectId, promptId);
      });
    });
  });
}
function showPromptForm(projectId, existing){
  const slot=document.getElementById('promptFormSlot');
  const p=state.projects.find(x=>x.id===projectId);
  const nextVersion=existing?existing.version:(Math.max(0,...(p.prompts||[]).map(pr=>pr.version))+1);
  slot.innerHTML=`
    <div style="background:hsl(var(--card));border:1px dashed hsl(var(--border));border-radius:8px;padding:14px;margin-bottom:12px;">
      <div class="field"><label>标题</label><input type="text" id="pf-title" value="${existing?esc(existing.title):''}" placeholder="例如：系统提示词 v${nextVersion}"></div>
      <div class="field"><label>版本号</label><input type="text" id="pf-version" value="${nextVersion}"></div>
      <div class="field"><label>Prompt 内容</label><textarea id="pf-content" rows="6" placeholder="在这里写下 / 粘贴 prompt 内容…">${existing?esc(existing.content):''}</textarea></div>
      <div class="field"><label>备注</label><input type="text" id="pf-notes" value="${existing?esc(existing.notes||''):''}" placeholder="这版改了什么、效果如何…"></div>
      <div style="display:flex;gap:8px;"><button class="btn btn-primary" id="pf-save" style="flex:1;">${existing?'保存修改':'添加'}</button><button class="btn btn-secondary" id="pf-cancel">取消</button></div>
    </div>`;
  document.getElementById('pf-cancel').addEventListener('click',()=>{ slot.innerHTML=''; });
  document.getElementById('pf-save').addEventListener('click',()=>{
    const title=document.getElementById('pf-title').value.trim();
    const content=document.getElementById('pf-content').value.trim();
    if(!title||!content){ showToast('标题和内容都要填写'); return; }
    const version=parseFloat(document.getElementById('pf-version').value)||nextVersion;
    const notes=document.getElementById('pf-notes').value.trim();
    const proj=state.projects.find(x=>x.id===projectId);
    if(existing){ Object.assign(existing,{title,content,version,notes}); }
    else{ proj.prompts=proj.prompts||[]; proj.prompts.push({id:uid('pr'),title,content,version,notes,isCurrent:proj.prompts.length===0,createdAt:new Date().toISOString()}); }
    proj.updatedAt=new Date().toISOString();
    saveData(); slot.innerHTML='';
    document.getElementById('promptList').innerHTML=renderPromptList(proj);
    bindPromptListEvents(projectId);
    render(); showToast(existing?'Prompt 已更新':'Prompt 已添加');
  });
}
function setCurrentPrompt(projectId,promptId){
  const p=state.projects.find(x=>x.id===projectId);
  p.prompts.forEach(pr=>pr.isCurrent=(pr.id===promptId));
  p.updatedAt=new Date().toISOString();
  saveData();
  document.getElementById('promptList').innerHTML=renderPromptList(p);
  bindPromptListEvents(projectId); render();
}
function deletePrompt(projectId,promptId){
  if(!confirm('确定删除这条 Prompt 吗？')) return;
  const p=state.projects.find(x=>x.id===projectId);
  p.prompts=p.prompts.filter(pr=>pr.id!==promptId);
  if(p.prompts.length&&!p.prompts.some(pr=>pr.isCurrent)) p.prompts[0].isCurrent=true;
  p.updatedAt=new Date().toISOString();
  saveData();
  document.getElementById('promptList').innerHTML=renderPromptList(p);
  bindPromptListEvents(projectId); render(); showToast('已删除');
}
function saveDetailFields(id){
  const p=state.projects.find(x=>x.id===id);
  p.name=document.getElementById('d-name').value.trim()||p.name;
  p.description=document.getElementById('d-desc').value.trim();
  p.stage=document.getElementById('d-stage').value;
  p.category=document.getElementById('d-category').value||'general';
  p.icon=document.getElementById('d-icon').value.trim()||null;
  const cText=document.getElementById('d-icon-color-text').value.trim();
  const cPick=document.getElementById('d-icon-color').value;
  p.icon_color=cText||cPick||null;
  p.tags=document.getElementById('d-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  p.paused=document.getElementById('d-paused').checked;
  p.updatedAt=new Date().toISOString();
  saveData(); render(); showToast('已保存');
}
function deleteProject(id){
  if(!confirm('确定删除整个项目吗？这会同时删除它下面的所有 Prompt，且无法恢复。')) return;
  state.projects=state.projects.filter(p=>p.id!==id);
  saveData(); closeOverlay(); render(); showToast('项目已删除');
}
function openOverlay(){ document.getElementById('overlay').classList.add('show'); }
function closeOverlay(){ document.getElementById('overlay').classList.remove('show'); }
function updateSearchClear(){
  const inp=document.getElementById('searchInput');
  const btn=document.getElementById('searchClear');
  if(!inp||!btn) return;
  if(inp.value) btn.classList.remove('hidden'); else btn.classList.add('hidden');
}
document.getElementById('overlay').addEventListener('click',(e)=>{ if(e.target.id==='overlay') closeOverlay(); });
document.getElementById('addProjectBtn').addEventListener('click',()=>openCreateModal());
const searchInput=document.getElementById('searchInput');
const debouncedRender=debounce(()=> render(), 180);
searchInput.addEventListener('input',(e)=>{ state.search=e.target.value; state.page=1; updateSearchClear(); debouncedRender(); });
document.getElementById('searchClear').addEventListener('click',()=>{ searchInput.value=''; state.search=''; state.page=1; updateSearchClear(); render(); searchInput.focus(); });
document.addEventListener('keydown',(e)=>{
  const isMod=e.metaKey||e.ctrlKey;
  if(isMod && e.key===',' ){ e.preventDefault(); openSyncSettings(); return; }
  if(isMod && (e.key==='n' || e.key==='N')){ if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return; e.preventDefault(); openCreateModal(); return; }
  if(isMod && (e.key==='k' || e.key==='K' || e.key==='f' || e.key==='F')){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
    e.preventDefault(); searchInput.focus();
  }
  if(e.key==='Escape'){
    if(document.activeElement===searchInput && searchInput.value){ searchInput.value=''; state.search=''; state.page=1; updateSearchClear(); render(); }
    if(document.getElementById('overlay').classList.contains('show')) closeOverlay();
    hideCtxMenu();
  }
});
document.getElementById('importJsonBtn').addEventListener('click', async()=>{
  try{
    const r=await fetch('./projects.json', {cache:'no-store'});
    if(!r.ok) throw new Error('no file');
    const d=await r.json();
    if(!Array.isArray(d.projects)) throw new Error('bad format');
    if(!confirm(`导入扫描到的 ${d.projects.length} 个项目？这将覆盖本地当前 ${state.projects.length} 个项目。`)) return;
    await safetyBackup('pre-import-projects-json');
    state.projects=d.projects;
    cacheLocally(state.projects); try{ await dbSaveProjects(state.projects); syncState.dirty=true; syncState.lastLocalAt=new Date().toISOString(); saveSyncState(syncState); }catch(e){}
    state.loaded=true;
    render();
    showToast(`已导入 ${d.projects.length} 个项目（已备份）`);
    if(hasSyncSettings() && confirm('是否立即推送到云端同步？')) pushToServer();
  }catch(e){ showToast('导入失败: '+e.message); }
});
const syncNowBtn=document.getElementById('syncNowBtn');
if(syncNowBtn) syncNowBtn.addEventListener('click',()=>{ if(!hasSyncSettings()){ openSyncSettings('尚未设置同步，请先在设置中填入 Worker 地址和密钥'); return; } pullFromServer(true); });
const settingsBtnEl=document.getElementById('settingsBtn');
if(settingsBtnEl) settingsBtnEl.addEventListener('click',()=>openSyncSettings());
async function openExternal(url){
  console.log('[openExternal] start', url, 'dbAvailable', dbAvailable(), 'internals', !!(window.__TAURI_INTERNALS__&&window.__TAURI_INTERNALS__.invoke));
  try{
    const u=new URL(url);
    if(!['http:','https:'].includes(u.protocol)) throw new Error('Unsupported scheme');
  }catch(e){ console.error('[openExternal] Invalid URL', e); throw new Error('Invalid URL'); }
  // 优先走 CC Switch 同款 Rust 桥（系统浏览器），不依赖 dbAvailable 判定
  try{
    console.log('[openExternal] tauri invoke open_external', url);
    const r=await tauriInvoke('open_external', {url});
    console.log('[openExternal] invoke ok', r);
    return;
  }catch(e){
    console.warn('[openExternal] invoke fail, fallback window.open', e);
    // 回退：浏览器环境或 invoke 不可用
    try{
      const w=window.open(url,'_blank');
      console.log('[openExternal] window.open result', !!w);
      if(w) return;
      throw new Error('window.open blocked');
    }catch(we){
      console.error('[openExternal] window.open fail', we);
      throw e; // 抛出原始 invoke 错误，便于上层 toast
    }
  }
}
const brandEl=document.getElementById('topbarBrand')||document.getElementById('topbarTitle');
console.log('[brand] init found', !!brandEl, brandEl?brandEl.id:'null', 'tauri', !!(window.__TAURI__));
if(brandEl){
  const goLanding=async()=>{
    const url='https://jungod1121.github.io/agent-workbench-app/';
    console.log('[brand] click goLanding', url);
    showToast('正在打开介绍页…');
    try{ await openExternal(url); showToast('已在系统浏览器打开'); console.log('[brand] openExternal success'); }
    catch(e){ console.error('[brand] openExternal fail', e); showToast('打开失败: '+(e&&e.message||e)); try{ const w=window.open(url,'_blank'); console.log('[brand] fallback window.open', !!w); if(!w) showToast('请手动访问: '+url); }catch(_){} }
  };
  brandEl.addEventListener('click', (e)=>{ console.log('[brand] click event'); e.preventDefault(); e.stopPropagation(); goLanding(); });
  brandEl.setAttribute('role','link');
  brandEl.setAttribute('tabindex','0');
  brandEl.addEventListener('keydown',(e)=>{ if(e.key==='Enter' || e.key===' ') { e.preventDefault(); goLanding(); }});
  // 确保可点击：移除可能阻挡的 drag
  brandEl.style.pointerEvents='auto';
  brandEl.style.webkitAppRegion='no-drag';
} else {
  console.warn('[brand] not found');
}
window.addEventListener('focus',()=>{ if(hasSyncSettings()&&state.loaded) pullFromServer(false); if(state.loaded) render(); });
setInterval(()=>{ if(hasSyncSettings()&&state.loaded) pullFromServer(false); },60000);
(function initTauriEvents(){
  try{
    const tauriEvent = window.__TAURI__ && window.__TAURI__.event;
    if(tauriEvent && tauriEvent.listen){
      tauriEvent.listen('stage-switch', (e)=>{ const s=e.payload; if(typeof s==='string'){ state.filterStage=s; render(); showToast('已切换到 '+ (stageInfo(s).label||s)); }});
      tauriEvent.listen('deeplink-import', (e)=>{
        const raw=typeof e.payload==='string'?e.payload:e.payload;
        try{
          const url=new URL(raw);
          const q=url.searchParams;
          const syncUrl=q.get('url')||q.get('worker')||'';
          const token=q.get('token')||'';
          if(syncUrl && token){
            settings={url:syncUrl, token: token};
            saveSettings(settings);
            showToast('已通过 DeepLink 导入同步配置');
            pullFromServer(true);
          } else {
            showToast('DeepLink: '+raw);
          }
        }catch(err){ showToast('DeepLink 导入失败: '+raw); }
      });
    }
  }catch(e){}
})();
(async function boot(){
  settings=loadSettings();
  // ---- W1: DB 优先（对标 CC Switch Database::init + WAL）+ 断电不丢 ----
  let dbProjects=null;
  try{ dbProjects=await dbGetProjects(); }catch(e){}
  if(Array.isArray(dbProjects) && dbProjects.length){
    state.projects=dbProjects; cacheLocally(state.projects);
  } else {
    const cache=readCache();
    if(cache&&Array.isArray(cache.projects) && cache.projects.length>0){ state.projects=cache.projects; try{ await dbSaveProjects(state.projects); }catch(e){} }
    else {
      try{
        const r=await fetch('./projects.json', {cache:'no-store'});
        if(r.ok){
          const d=await r.json();
          if(Array.isArray(d.projects) && d.projects.length){
            state.projects=d.projects;
            cacheLocally(state.projects); try{ await dbSaveProjects(state.projects); }catch(e){}
          } else { state.projects=[]; }
        } else { state.projects=[]; }
      }catch(e){ state.projects=[]; }
      if(!state.projects.length && cache&&Array.isArray(cache.projects)) { state.projects=cache.projects; try{ await dbSaveProjects(state.projects); }catch(e){} }
    }
    // 若 DB 空但有数据，说明首次由 localStorage 迁移
    if(Array.isArray(dbProjects) && dbProjects.length===0 && state.projects.length>0){
      try{ await dbSaveProjects(state.projects); await safetyBackup('migrate-localstorage-to-sqlite'); }catch(e){}
    }
  }
  state.loaded=true;
  console.log('[boot] projects', (state.projects||[]).length, 'firstStage', (state.projects[0]||{}).stage, 'win', window.innerWidth+'x'+window.innerHeight, 'theme', document.documentElement.className, 'db', dbAvailable());
  rep('[probe] boot projects='+(state.projects||[]).length+' first='+JSON.stringify(state.projects[0]||{}).slice(0,160));
  render();
  setTimeout(()=>{ const g=document.getElementById('gridArea'); rep('[probe] t+3s rows='+(g?g.querySelectorAll('.list-row').length:0)+' gauges='+(g?g.querySelectorAll('.gauge').length:0)+' pills='+(document.getElementById('stagePill')?document.getElementById('stagePill').children.length:0)); }, 3000);
  // 窗口 120ms 后才 show：隐藏期渲染的 innerHTML 在 WKWebView 可能不 paint，
  // 窗口可见后再 render 一次强制重绘（解决启动阶段条不可见）
  setTimeout(()=>{ if(state.loaded) render(); }, 600);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && state.loaded) render(); });
  if(hasSyncSettings()){ setSyncStatus('syncing'); await pullFromServer(false); } else { setSyncStatus('idle'); }
})();
</script>
