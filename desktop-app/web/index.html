<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Workbench</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
:root {
  --paper: #EEF0EA; --paper-line: rgba(27,31,29,0.055);
  --surface: #FFFFFF; --border: #DBE0D8;
  --ink: #1B1F1D; --ink-soft: #5B615C; --ink-faint: #8A9089;
  --accent: #24313F; --accent-soft: #E7EBEE;
  --idea: #B4791F; --idea-bg: #FBF1DF;
  --building: #2E6FA8; --building-bg: #E4EEF6;
  --testing: #6B4FA0; --testing-bg: #EEE8F5;
  --live: #2F8F5D; --live-bg: #E3F3EA;
  --paused: #74796F; --paused-bg: #E9E9E4;
  --danger: #B4432F; --warn: #B4791F; --warn-bg: #FBF1DF;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(27,31,29,0.06), 0 8px 24px -12px rgba(27,31,29,0.18);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    repeating-linear-gradient(0deg, var(--paper-line) 0px, var(--paper-line) 1px, transparent 1px, transparent 32px),
    repeating-linear-gradient(90deg, var(--paper-line) 0px, var(--paper-line) 1px, transparent 1px, transparent 32px),
    var(--paper);
  color: var(--ink); font-family: 'IBM Plex Sans', sans-serif;
  -webkit-font-smoothing: antialiased; user-select: none;
}
input, textarea { user-select: text; }
.mono { font-family: 'IBM Plex Mono', monospace; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 20px 20px 80px; }
.hidden { display: none !important; }

/* Titlebar drag region for frameless feel (Tauri default has native chrome, this is just top padding) */
.titlebar-spacer { height: 4px; }

/* Onboarding / settings screen */
.connect-screen { max-width: 520px; margin: 70px auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px 28px; box-shadow: var(--shadow); }
.connect-screen h2 { font-family: 'Space Grotesk', sans-serif; font-size: 21px; margin: 0 0 8px; text-align: center; }
.connect-screen p.lead { color: var(--ink-soft); font-size: 14px; line-height: 1.6; margin: 0 0 22px; text-align: center; }
.field { margin-bottom: 14px; text-align: left; }
.field label { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; }
.field input[type=text], .field input[type=password], .field textarea, .field select {
  width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: var(--ink); resize: vertical;
}
.field input.mono, .field textarea.mono { font-family: 'IBM Plex Mono', monospace; font-size: 13px; }
.field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.hint { font-size: 12px; color: var(--ink-faint); margin-top: 4px; line-height: 1.5; }
.error-box { background: var(--warn-bg); color: var(--danger); border-radius: 8px; padding: 10px 14px; font-size: 12.5px; margin-bottom: 16px; line-height: 1.6; }

.btn { font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 13.5px; padding: 9px 16px; border-radius: var(--radius); border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; white-space: nowrap; transition: transform 0.08s, opacity 0.12s; }
.btn:hover { opacity: 0.88; } .btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn-ghost { background: transparent; color: var(--ink); border: 1px solid var(--border); font-weight: 500; }
.btn-ghost:hover { border-color: var(--ink-faint); opacity: 1; }
.btn-danger { background: var(--danger); border-color: var(--danger); }
.btn-sm { padding: 6px 11px; font-size: 12.5px; border-radius: 8px; }

/* Sync bar */
.connect-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 18px; font-size: 13px; }
.connect-status { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.ok { background: var(--live); }
.dot.warn { background: var(--warn); }
.dot.off { background: var(--danger); }
.dot.busy { background: var(--building); animation: pulse 1s infinite ease-in-out; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
.connect-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.header { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; margin-bottom: 22px; padding-bottom: 20px; border-bottom: 1.5px solid var(--ink); }
.header-left .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: var(--ink-faint); text-transform: uppercase; margin-bottom: 6px; }
.header-left h1 { font-family: 'Space Grotesk', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 4px; }
.header-left p { margin: 0; color: var(--ink-soft); font-size: 14px; }
.stats { display: flex; gap: 6px; flex-wrap: wrap; }
.stat-pill { font-family: 'IBM Plex Mono', monospace; font-size: 12px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft); white-space: nowrap; }
.stat-pill b { color: var(--ink); font-weight: 600; }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 22px; }
.search-box { flex: 1; min-width: 180px; }
.search-box input { width: 100%; padding: 9px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); font-size: 14px; color: var(--ink); }
.search-box input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12.5px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-soft); cursor: pointer; font-family: 'IBM Plex Mono', monospace; transition: background 0.12s, color 0.12s, border-color 0.12s; }
.chip:hover { border-color: var(--ink-faint); }
.chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 16px 14px; cursor: pointer; box-shadow: var(--shadow); transition: transform 0.1s; position: relative; overflow: hidden; }
.card:hover { transform: translateY(-2px); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.card-name { font-family: 'Space Grotesk', sans-serif; font-size: 16.5px; font-weight: 600; line-height: 1.3; }
.badge { font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 3px 8px; border-radius: 999px; white-space: nowrap; font-weight: 500; }
.card-desc { color: var(--ink-soft); font-size: 13px; line-height: 1.5; margin: 0 0 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 19.5px; }
.gauge { display: flex; align-items: center; gap: 4px; margin-bottom: 12px; }
.gauge-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
.gauge-line { flex: 1; height: 2px; background: var(--border); border-radius: 1px; }
.gauge-label { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ink-faint); margin-left: 4px; }
.card-foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--ink-faint); }
.tag-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 10px; }
.tag { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; padding: 2px 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); }
.paused-ribbon { position: absolute; top: 14px; right: -30px; background: var(--paused); color: #fff; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; padding: 3px 34px; transform: rotate(38deg); letter-spacing: 0.05em; }

.empty { text-align: center; padding: 70px 20px; color: var(--ink-soft); }
.empty h3 { font-family: 'Space Grotesk', sans-serif; color: var(--ink); font-size: 19px; margin-bottom: 6px; }
.empty p { font-size: 14px; margin-bottom: 18px; }

.overlay { position: fixed; inset: 0; background: rgba(20,22,20,0.4); display: none; align-items: stretch; justify-content: flex-end; z-index: 50; }
.overlay.show { display: flex; }
.drawer { width: min(560px, 100%); background: var(--paper); height: 100%; overflow-y: auto; padding: 26px 26px 60px; box-shadow: -12px 0 32px rgba(0,0,0,0.15); }
.drawer-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
.drawer-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--ink-soft); line-height: 1; padding: 4px; }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }
.checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--ink-soft); margin-bottom: 16px; }
hr.divider { border: none; border-top: 1px solid var(--border); margin: 22px 0; }
.section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.section-head h3 { font-family: 'Space Grotesk', sans-serif; font-size: 15px; margin: 0; }
.prompt-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
.prompt-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.prompt-title { font-weight: 600; font-size: 14px; }
.prompt-meta { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ink-faint); }
.prompt-content { background: var(--paper); border: 1px solid var(--paper-line); border-radius: 6px; padding: 9px 10px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--ink); white-space: pre-wrap; max-height: 160px; overflow-y: auto; margin-bottom: 8px; line-height: 1.5; }
.prompt-notes { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 8px; }
.prompt-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.current-badge { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 5px; background: var(--live-bg); color: var(--live); }
.form-inline { background: var(--surface); border: 1px dashed var(--ink-faint); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-size: 13px; font-family: 'IBM Plex Mono', monospace; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
@media (max-width: 560px) {
  .header { align-items: flex-start; }
  .drawer { width: 100%; padding: 20px 16px 50px; }
  .field-row { flex-direction: column; gap: 14px; }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="titlebar-spacer"></div>

  <!-- Onboarding: first run, ask for Worker URL + token -->
  <div class="connect-screen hidden" id="onboardScreen">
    <h2>连接同步服务</h2>
    <p class="lead">填入你部署的 Cloudflare Worker 地址和密钥，三台设备填同一组即可自动同步。</p>
    <div class="error-box hidden" id="onboardError"></div>
    <div class="field">
      <label>Worker 地址</label>
      <input type="text" class="mono" id="ob-url" placeholder="https://agent-workbench-sync.xxx.workers.dev">
    </div>
    <div class="field">
      <label>同步密钥（X-Sync-Token）</label>
      <input type="password" class="mono" id="ob-token" placeholder="部署时设置的密钥">
      <div class="hint">密钥只会保存在这台设备本地，不会发送到除你自己的 Worker 以外的任何地方。</div>
    </div>
    <button class="btn" id="ob-connect" style="width:100%;margin-top:6px;">连接并同步</button>
  </div>

  <!-- Main app -->
  <div id="appRoot" class="hidden">
    <div class="connect-bar">
      <div class="connect-status"><span class="dot" id="connDot"></span><span id="connText" class="mono"></span></div>
      <div class="connect-actions">
        <button class="btn-ghost btn btn-sm" id="syncNowBtn">立即同步</button>
        <button class="btn-ghost btn btn-sm" id="settingsBtn">连接设置</button>
      </div>
    </div>

    <div class="header">
      <div class="header-left">
        <div class="eyebrow">Cross-Device · Cloudflare Sync</div>
        <h1>Agent Workbench</h1>
        <p>项目与 Prompt 版本管理，三端自动同步。</p>
      </div>
      <div class="stats" id="stats"></div>
    </div>

    <div class="toolbar">
      <div class="search-box"><input type="text" id="searchInput" placeholder="搜索项目名称 / 标签…"></div>
      <div class="chips" id="filterChips"></div>
      <button class="btn" id="addProjectBtn">+ 新建项目</button>
    </div>

    <div id="gridArea"></div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="drawer" id="drawer"></div></div>
<div class="toast" id="toast"></div>

<script>
const STAGES = [
  { key: 'idea',     label: '构思中', color: 'var(--idea)',     bg: 'var(--idea-bg)' },
  { key: 'building', label: '开发中', color: 'var(--building)', bg: 'var(--building-bg)' },
  { key: 'testing',  label: '测试中', color: 'var(--testing)',  bg: 'var(--testing-bg)' },
  { key: 'live',     label: '已上线', color: 'var(--live)',     bg: 'var(--live-bg)' },
];
const SETTINGS_KEY = 'workbench-settings';
const CACHE_KEY = 'workbench-cache';

let state = { projects: [], filterStage: 'all', search: '', loaded: false };
let settings = null; // { url, token }
let syncStatus = 'idle'; // idle | syncing | ok | offline | error
let pushTimer = null;

// ---------- settings ----------
function loadSettings() {
  try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null'); } catch (e) { return null; }
}
function saveSettings(s) { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }

// ---------- local cache (offline fallback) ----------
function cacheLocally(projects) {
  localStorage.setItem(CACHE_KEY, JSON.stringify({ projects, cachedAt: new Date().toISOString() }));
}
function readCache() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch (e) { return null; }
}

// ---------- API ----------
function apiUrl(path) { return settings.url.replace(/\/+$/, '') + path; }
async function apiGet() {
  const res = await fetch(apiUrl('/api/state'), { headers: { 'X-Sync-Token': settings.token } });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
async function apiPut(projects) {
  const res = await fetch(apiUrl('/api/state'), {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json', 'X-Sync-Token': settings.token },
    body: JSON.stringify({ projects }),
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

// ---------- sync orchestration ----------
async function pullFromServer(showToastOnSuccess) {
  setSyncStatus('syncing');
  try {
    const data = await apiGet();
    state.projects = data.projects || [];
    state.loaded = true;
    cacheLocally(state.projects);
    setSyncStatus('ok', data.updatedAt);
    render();
    if (showToastOnSuccess) showToast('已同步最新数据');
  } catch (e) {
    const cache = readCache();
    if (cache) { state.projects = cache.projects; state.loaded = true; }
    else if (!state.loaded) { state.projects = []; state.loaded = true; }
    setSyncStatus('offline');
    render();
  }
}

function scheduleAutoPush() {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushToServer, 500); // 防抖：连续操作只发一次
}

async function pushToServer() {
  cacheLocally(state.projects); // 本地缓存立刻更新，保证界面响应快、离线也不丢
  setSyncStatus('syncing');
  try {
    const res = await apiPut(state.projects);
    setSyncStatus('ok', res.updatedAt);
  } catch (e) {
    setSyncStatus('offline');
    showToast('同步失败，已保存在本地，联网后会自动重试');
  }
}

async function saveData() {
  scheduleAutoPush();
}

function setSyncStatus(status, updatedAt) {
  syncStatus = status;
  const dot = document.getElementById('connDot');
  const text = document.getElementById('connText');
  if (!dot) return;
  if (status === 'syncing') { dot.className = 'dot busy'; text.textContent = '同步中…'; }
  else if (status === 'ok') { dot.className = 'dot ok'; text.textContent = '已同步' + (updatedAt ? '（' + relTime(updatedAt) + '）' : ''); }
  else if (status === 'offline') { dot.className = 'dot warn'; text.textContent = '离线 · 显示本地缓存，联网后会自动重试'; }
  else { dot.className = 'dot off'; text.textContent = '未连接'; }
}

// ---------- onboarding ----------
function showOnboarding(prefillError) {
  document.getElementById('appRoot').classList.add('hidden');
  document.getElementById('onboardScreen').classList.remove('hidden');
  if (settings) {
    document.getElementById('ob-url').value = settings.url || '';
    document.getElementById('ob-token').value = settings.token || '';
  }
  const errBox = document.getElementById('onboardError');
  if (prefillError) { errBox.textContent = prefillError; errBox.classList.remove('hidden'); }
  else { errBox.classList.add('hidden'); }
}

async function connectAndEnter() {
  const url = document.getElementById('ob-url').value.trim();
  const token = document.getElementById('ob-token').value.trim();
  const errBox = document.getElementById('onboardError');
  if (!url || !token) { errBox.textContent = '请填写完整的 Worker 地址和密钥'; errBox.classList.remove('hidden'); return; }
  settings = { url, token };
  const btn = document.getElementById('ob-connect');
  btn.disabled = true; btn.textContent = '连接中…';
  try {
    await apiGet(); // 验证一下能不能连通、密钥对不对
    saveSettings(settings);
    document.getElementById('onboardScreen').classList.add('hidden');
    document.getElementById('appRoot').classList.remove('hidden');
    await pullFromServer(false);
    render();
  } catch (e) {
    errBox.textContent = '连接失败：请检查地址是否正确、密钥是否匹配，以及网络是否正常。（' + e.message + '）';
    errBox.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.textContent = '连接并同步';
  }
}

// ---------- helpers ----------
function uid(prefix) { return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function stageInfo(key) { return STAGES.find(s => s.key === key) || STAGES[0]; }
function stageIndex(key) { return STAGES.findIndex(s => s.key === key); }
function esc(str) { const d = document.createElement('div'); d.textContent = str ?? ''; return d.innerHTML; }
function relTime(iso) {
  if (!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  const min = Math.floor(diff / 60000);
  if (min < 1) return '刚刚';
  if (min < 60) return min + ' 分钟前';
  const hr = Math.floor(min / 60);
  if (hr < 24) return hr + ' 小时前';
  const day = Math.floor(hr / 24);
  if (day < 30) return day + ' 天前';
  return new Date(iso).toLocaleDateString('zh-CN');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ---------- render: stats + chips ----------
function renderStats() {
  const el = document.getElementById('stats');
  const counts = {}; STAGES.forEach(s => counts[s.key] = 0);
  let paused = 0;
  state.projects.forEach(p => { counts[p.stage] = (counts[p.stage] || 0) + 1; if (p.paused) paused++; });
  el.innerHTML = STAGES.map(s => `<div class="stat-pill">${s.label} <b>${counts[s.key] || 0}</b></div>`).join('')
    + `<div class="stat-pill">已暂停 <b>${paused}</b></div>`;
}
function renderChips() {
  const el = document.getElementById('filterChips');
  const all = [{ key: 'all', label: '全部' }, ...STAGES, { key: 'paused', label: '已暂停' }];
  el.innerHTML = all.map(s => `<button class="chip ${state.filterStage === s.key ? 'active' : ''}" data-stage="${s.key}">${s.label}</button>`).join('');
  el.querySelectorAll('.chip').forEach(btn => btn.addEventListener('click', () => { state.filterStage = btn.dataset.stage; render(); }));
}

function filteredProjects() {
  return state.projects
    .filter(p => state.filterStage === 'paused' ? p.paused : (state.filterStage === 'all' ? true : p.stage === state.filterStage))
    .filter(p => {
      if (!state.search) return true;
      const q = state.search.toLowerCase();
      return p.name.toLowerCase().includes(q) || (p.tags || []).some(t => t.toLowerCase().includes(q));
    })
    .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
}

function renderGrid() {
  const el = document.getElementById('gridArea');
  const list = filteredProjects();
  if (state.projects.length === 0) {
    el.innerHTML = `<div class="empty"><h3>还没有项目</h3><p>把你正在构思或搭建的第一个 Agent 项目加进来。</p><button class="btn" id="emptyAddBtn">+ 新建项目</button></div>`;
    document.getElementById('emptyAddBtn').addEventListener('click', () => openCreateModal());
    return;
  }
  if (list.length === 0) {
    el.innerHTML = `<div class="empty"><h3>没有匹配的项目</h3><p>试试换个筛选条件或搜索词。</p></div>`;
    return;
  }
  el.innerHTML = `<div class="grid">${list.map(cardHtml).join('')}</div>`;
  list.forEach(p => document.getElementById('card-' + p.id).addEventListener('click', () => openDetail(p.id)));
}

function cardHtml(p) {
  const s = stageInfo(p.stage);
  const idx = stageIndex(p.stage);
  const promptCount = (p.prompts || []).length;
  return `
  <div class="card" id="card-${p.id}">
    ${p.paused ? '<div class="paused-ribbon">暂停</div>' : ''}
    <div class="card-top"><div class="card-name">${esc(p.name)}</div><div class="badge" style="background:${s.bg};color:${s.color}">${s.label}</div></div>
    <p class="card-desc">${esc(p.description) || '暂无简介'}</p>
    ${(p.tags && p.tags.length) ? `<div class="tag-row">${p.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}
    <div class="gauge">
      ${STAGES.map((st, i) => `
        <div class="gauge-dot" style="background:${i <= idx ? s.color : 'var(--border)'}"></div>
        ${i < STAGES.length - 1 ? `<div class="gauge-line" style="background:${i < idx ? s.color : 'var(--border)'}"></div>` : ''}
      `).join('')}
      <span class="gauge-label">${idx + 1}/${STAGES.length}</span>
    </div>
    <div class="card-foot"><span>${promptCount} 条 Prompt</span><span>更新于 ${relTime(p.updatedAt)}</span></div>
  </div>`;
}

function render() { if (!state.loaded) return; renderStats(); renderChips(); renderGrid(); }

// ---------- create project ----------
function openCreateModal() {
  const drawer = document.getElementById('drawer');
  drawer.innerHTML = `
    <div class="drawer-head"><h2 style="font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0;">新建项目</h2><button class="drawer-close" id="closeBtn">&times;</button></div>
    <div class="field"><label>项目名称</label><input type="text" id="f-name" placeholder="例如：客服自动回复 Agent"></div>
    <div class="field"><label>简介</label><textarea id="f-desc" rows="3" placeholder="这个 Agent 是做什么的…"></textarea></div>
    <div class="field-row">
      <div class="field"><label>阶段</label><select id="f-stage">${STAGES.map(s => `<option value="${s.key}">${s.label}</option>`).join('')}</select></div>
      <div class="field"><label>标签（逗号分隔）</label><input type="text" id="f-tags" placeholder="客服, GPT-4, 内部工具"></div>
    </div>
    <button class="btn" id="saveNewBtn" style="width:100%;margin-top:6px;">创建项目</button>`;
  openOverlay();
  document.getElementById('closeBtn').addEventListener('click', closeOverlay);
  document.getElementById('f-name').focus();
  document.getElementById('saveNewBtn').addEventListener('click', () => {
    const name = document.getElementById('f-name').value.trim();
    if (!name) { showToast('请填写项目名称'); return; }
    const tags = document.getElementById('f-tags').value.split(',').map(t => t.trim()).filter(Boolean);
    const now = new Date().toISOString();
    state.projects.push({
      id: uid('p'), name, description: document.getElementById('f-desc').value.trim(),
      stage: document.getElementById('f-stage').value, paused: false, tags, prompts: [],
      createdAt: now, updatedAt: now,
    });
    saveData(); closeOverlay(); render(); showToast('项目已创建');
  });
}

// ---------- detail drawer ----------
function openDetail(id) { const p = state.projects.find(x => x.id === id); if (!p) return; renderDetail(p); openOverlay(); }

function renderDetail(p) {
  const drawer = document.getElementById('drawer');
  drawer.innerHTML = `
    <div class="drawer-head"><h2 style="font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0;">项目详情</h2><button class="drawer-close" id="closeBtn">&times;</button></div>
    <div class="field"><label>项目名称</label><input type="text" id="d-name" value="${esc(p.name)}"></div>
    <div class="field"><label>简介</label><textarea id="d-desc" rows="3">${esc(p.description)}</textarea></div>
    <div class="field-row">
      <div class="field"><label>阶段</label><select id="d-stage">${STAGES.map(s => `<option value="${s.key}" ${s.key === p.stage ? 'selected' : ''}>${s.label}</option>`).join('')}</select></div>
      <div class="field"><label>标签（逗号分隔）</label><input type="text" id="d-tags" value="${esc((p.tags || []).join(', '))}"></div>
    </div>
    <div class="checkbox-row"><input type="checkbox" id="d-paused" ${p.paused ? 'checked' : ''}><label for="d-paused" style="margin:0;text-transform:none;font-family:'IBM Plex Sans',sans-serif;font-size:13.5px;letter-spacing:0;">标记为暂停</label></div>
    <div style="display:flex;gap:8px;">
      <button class="btn" id="saveDetailBtn" style="flex:1;">保存修改</button>
      <button class="btn btn-danger" id="deleteProjectBtn">删除项目</button>
    </div>
    <hr class="divider">
    <div class="section-head"><h3>Prompt 版本 (${(p.prompts || []).length})</h3><button class="btn btn-ghost btn-sm" id="addPromptBtn">+ 添加 Prompt</button></div>
    <div id="promptFormSlot"></div>
    <div id="promptList">${renderPromptList(p)}</div>`;
  document.getElementById('closeBtn').addEventListener('click', closeOverlay);
  document.getElementById('saveDetailBtn').addEventListener('click', () => saveDetailFields(p.id));
  document.getElementById('deleteProjectBtn').addEventListener('click', () => deleteProject(p.id));
  document.getElementById('addPromptBtn').addEventListener('click', () => showPromptForm(p.id, null));
  bindPromptListEvents(p.id);
}

function renderPromptList(p) {
  const prompts = (p.prompts || []).slice().sort((a, b) => b.version - a.version);
  if (prompts.length === 0) return `<p style="color:var(--ink-soft);font-size:13.5px;">还没有添加 Prompt。</p>`;
  return prompts.map(pr => `
    <div class="prompt-card" data-prompt-id="${pr.id}">
      <div class="prompt-top">
        <div><span class="prompt-title">${esc(pr.title)}</span>${pr.isCurrent ? '<span class="current-badge" style="margin-left:6px;">当前版本</span>' : ''}</div>
        <span class="prompt-meta">v${pr.version} · ${relTime(pr.createdAt)}</span>
      </div>
      <div class="prompt-content">${esc(pr.content)}</div>
      ${pr.notes ? `<div class="prompt-notes">备注：${esc(pr.notes)}</div>` : ''}
      <div class="prompt-actions">
        ${!pr.isCurrent ? `<button class="btn btn-ghost btn-sm" data-act="current">设为当前版本</button>` : ''}
        <button class="btn btn-ghost btn-sm" data-act="edit">编辑</button>
        <button class="btn btn-ghost btn-sm" data-act="delete">删除</button>
      </div>
    </div>`).join('');
}

function bindPromptListEvents(projectId) {
  const container = document.getElementById('promptList');
  container.querySelectorAll('.prompt-card').forEach(card => {
    const promptId = card.dataset.promptId;
    card.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const act = btn.dataset.act;
        if (act === 'current') setCurrentPrompt(projectId, promptId);
        else if (act === 'edit') { const p = state.projects.find(x => x.id === projectId); showPromptForm(projectId, p.prompts.find(x => x.id === promptId)); }
        else if (act === 'delete') deletePrompt(projectId, promptId);
      });
    });
  });
}

function showPromptForm(projectId, existing) {
  const slot = document.getElementById('promptFormSlot');
  const p = state.projects.find(x => x.id === projectId);
  const nextVersion = existing ? existing.version : (Math.max(0, ...(p.prompts || []).map(pr => pr.version)) + 1);
  slot.innerHTML = `
    <div class="form-inline">
      <div class="field"><label>标题</label><input type="text" class="mono" id="pf-title" value="${existing ? esc(existing.title) : ''}" placeholder="例如：系统提示词 v${nextVersion}"></div>
      <div class="field-row"><div class="field"><label>版本号</label><input type="text" id="pf-version" value="${nextVersion}"></div></div>
      <div class="field"><label>Prompt 内容</label><textarea class="mono" id="pf-content" rows="6" placeholder="在这里写下 / 粘贴 prompt 内容…">${existing ? esc(existing.content) : ''}</textarea></div>
      <div class="field"><label>备注</label><input type="text" id="pf-notes" value="${existing ? esc(existing.notes || '') : ''}" placeholder="这版改了什么、效果如何…"></div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-sm" id="pf-save" style="flex:1;">${existing ? '保存修改' : '添加'}</button>
        <button class="btn btn-ghost btn-sm" id="pf-cancel">取消</button>
      </div>
    </div>`;
  document.getElementById('pf-cancel').addEventListener('click', () => { slot.innerHTML = ''; });
  document.getElementById('pf-save').addEventListener('click', () => {
    const title = document.getElementById('pf-title').value.trim();
    const content = document.getElementById('pf-content').value.trim();
    if (!title || !content) { showToast('标题和内容都要填写'); return; }
    const version = parseFloat(document.getElementById('pf-version').value) || nextVersion;
    const notes = document.getElementById('pf-notes').value.trim();
    const proj = state.projects.find(x => x.id === projectId);
    if (existing) { Object.assign(existing, { title, content, version, notes }); }
    else {
      proj.prompts = proj.prompts || [];
      proj.prompts.push({ id: uid('pr'), title, content, version, notes, isCurrent: proj.prompts.length === 0, createdAt: new Date().toISOString() });
    }
    proj.updatedAt = new Date().toISOString();
    saveData(); slot.innerHTML = '';
    document.getElementById('promptList').innerHTML = renderPromptList(proj);
    bindPromptListEvents(projectId);
    document.querySelector('.section-head h3').textContent = `Prompt 版本 (${proj.prompts.length})`;
    render(); showToast(existing ? 'Prompt 已更新' : 'Prompt 已添加');
  });
}

function setCurrentPrompt(projectId, promptId) {
  const p = state.projects.find(x => x.id === projectId);
  p.prompts.forEach(pr => pr.isCurrent = (pr.id === promptId));
  p.updatedAt = new Date().toISOString();
  saveData();
  document.getElementById('promptList').innerHTML = renderPromptList(p);
  bindPromptListEvents(projectId); render();
}

function deletePrompt(projectId, promptId) {
  if (!confirm('确定删除这条 Prompt 吗？')) return;
  const p = state.projects.find(x => x.id === projectId);
  p.prompts = p.prompts.filter(pr => pr.id !== promptId);
  if (p.prompts.length && !p.prompts.some(pr => pr.isCurrent)) p.prompts[0].isCurrent = true;
  p.updatedAt = new Date().toISOString();
  saveData();
  document.getElementById('promptList').innerHTML = renderPromptList(p);
  bindPromptListEvents(projectId); render(); showToast('已删除');
}

function saveDetailFields(id) {
  const p = state.projects.find(x => x.id === id);
  p.name = document.getElementById('d-name').value.trim() || p.name;
  p.description = document.getElementById('d-desc').value.trim();
  p.stage = document.getElementById('d-stage').value;
  p.tags = document.getElementById('d-tags').value.split(',').map(t => t.trim()).filter(Boolean);
  p.paused = document.getElementById('d-paused').checked;
  p.updatedAt = new Date().toISOString();
  saveData(); render(); showToast('已保存');
}

function deleteProject(id) {
  if (!confirm('确定删除整个项目吗？这会同时删除它下面的所有 Prompt，且无法恢复。')) return;
  state.projects = state.projects.filter(p => p.id !== id);
  saveData(); closeOverlay(); render(); showToast('项目已删除');
}

// ---------- overlay ----------
function openOverlay() { document.getElementById('overlay').classList.add('show'); }
function closeOverlay() { document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', (e) => { if (e.target.id === 'overlay') closeOverlay(); });

// ---------- top-level bindings ----------
document.getElementById('ob-connect').addEventListener('click', connectAndEnter);
document.getElementById('addProjectBtn').addEventListener('click', () => openCreateModal());
document.getElementById('searchInput').addEventListener('input', (e) => { state.search = e.target.value; render(); });
document.getElementById('syncNowBtn').addEventListener('click', () => pullFromServer(true));
document.getElementById('settingsBtn').addEventListener('click', () => showOnboarding());

// 窗口重新获得焦点时自动拉取一次（比如从另一台设备切回来）
window.addEventListener('focus', () => { if (settings && state.loaded) pullFromServer(false); });
// 每 60 秒轮询一次，保证放着不动也能看到别的设备的更新
setInterval(() => { if (settings && state.loaded) pullFromServer(false); }, 60000);

// ---------- boot ----------
(async function boot() {
  settings = loadSettings();
  if (!settings || !settings.url || !settings.token) { showOnboarding(); return; }
  document.getElementById('appRoot').classList.remove('hidden');
  await pullFromServer(false);
  render();
})();
</script>
</body>
</html>
