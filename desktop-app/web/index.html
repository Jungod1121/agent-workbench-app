<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Workbench</title>
<style>
/* CC Switch 对标 · 12-17 落地：64头/无Bento/外密16/无大标题/行式h16/多蓝多圆角阴影500 */
:root{
  --background: 0 0% 100%; --foreground: 240 10% 3.9%;
  --card: 0 0% 100%; --card-foreground: 240 10% 3.9%;
  --popover: 0 0% 100%; --popover-foreground: 240 10% 3.9%;
  --primary: 210 100% 56%; --primary-foreground: 0 0% 100%;
  --secondary: 240 4.8% 95.9%; --secondary-foreground: 240 5.9% 10%;
  --muted: 240 4.8% 95.9%; --muted-foreground: 240 3.8% 46.1%;
  --accent: 240 4.8% 95.9%; --accent-foreground: 240 5.9% 10%;
  --destructive: 0 84.2% 60.2%; --destructive-foreground: 0 0% 98%;
  --border: 240 5.9% 90%; --input: 240 5.9% 90%; --ring: 210 100% 56%;
  --radius: 0.5rem;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.dark{
  --background: 240 5% 12%; --foreground: 0 0% 98%;
  --card: 240 5% 16%; --card-foreground: 0 0% 98%;
  --popover: 240 5% 16%; --popover-foreground: 0 0% 98%;
  --primary: 210 100% 54%; --primary-foreground: 0 0% 100%;
  --secondary: 240 5% 18%; --secondary-foreground: 0 0% 98%;
  --muted: 240 5% 18%; --muted-foreground: 240 5% 64.9%;
  --accent: 240 5% 18%; --accent-foreground: 0 0% 98%;
  --destructive: 0 62.8% 30.6%; --destructive-foreground: 0 0% 98%;
  --border: 240 5% 24%; --input: 240 5% 24%; --ring: 210 100% 54%;
}
*{box-sizing:border-box}
html{font-family:var(--font-sans); -webkit-font-smoothing:antialiased; line-height:1.5}
body{margin:0; background:hsl(var(--background)); color:hsl(var(--foreground)); font-size:14px}
:focus-visible{outline:2px solid hsl(var(--primary)); outline-offset:2px}
.skip-link{position:absolute; left:-9999px; top:auto; width:1px; height:1px; overflow:hidden}
.skip-link:focus{left:16px; top:16px; width:auto; height:auto; padding:10px 16px; background:hsl(var(--foreground)); color:hsl(var(--background)); border-radius:9999px; z-index:1000; font-size:12px; font-weight:600}
.drag-bar{position:fixed; top:0; left:0; right:0; height:28px; z-index:1000; -webkit-app-region:drag}
[data-tauri-drag-region]{-webkit-app-region:drag}
[data-tauri-no-drag]{-webkit-app-region:no-drag}
.app-shell{position:relative; display:flex; min-height:100vh; padding:28px 0 0; gap:0}
.main{flex:1; min-width:0; display:flex; flex-direction:column; background:hsl(var(--background))}
/* 12 顶高64 T0 28+64 */
.topbar{
  position:sticky; top:28px; z-index:10; height:64px;
  display:flex; align-items:center; gap:12px; padding:0 24px;
  background: hsl(var(--background) / 0.8);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom:1px solid hsl(var(--border));
}
.topbar-left{display:flex; align-items:center; gap:10px; flex-shrink:0}
.topbar-logo{width:28px; height:28px; border-radius:8px; background:hsl(var(--primary)); color:#fff; display:grid; place-items:center; font-size:13px; font-weight:700}
.topbar-title{font-size:16px; font-weight:600; letter-spacing:-0.01em}
.topbar-meta{font-size:12px; color:hsl(var(--muted-foreground))}
/* 阶段 pill 单列主导航（CC AppSwitcher 思路） */
.topbar-center{flex:1; display:flex; justify-content:center; min-width:0; overflow:hidden}
.stage-pill-wrap{position:relative; display:flex; align-items:center; min-width:0; max-width:100%}
.stage-pill{display:inline-flex; align-items:center; gap:4px; padding:4px; background:hsl(var(--muted)); border-radius:12px; overflow:hidden}
.stage-pill-item{
  min-height:32px; padding:6px 12px; border-radius:8px; border:1px solid transparent; background:transparent;
  font-size:13px; font-weight:500; color:hsl(var(--muted-foreground)); cursor:pointer; white-space:nowrap; flex-shrink:0;
  transition: all .2s ease;
}
.stage-pill-item:hover{background:hsl(var(--background) / 0.6); color:hsl(var(--foreground))}
.stage-pill-item.active{background:hsl(var(--background)); color:hsl(var(--foreground)); font-weight:600; box-shadow: 0 1px 2px rgba(0,0,0,0.06); border-color:hsl(var(--border))}
.stage-pill-item:active{transform:scale(0.97)}
.stage-popover{position:absolute; top:calc(100% + 8px); right:0; min-width:180px; padding:6px; background:hsl(var(--popover)); border:1px solid hsl(var(--border)); border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.08); z-index:20; display:flex; flex-direction:column; gap:2px}
.stage-popover.hidden{display:none}
.topbar-right{display:flex; align-items:center; gap:10px; flex-shrink:0}
.topbar-search{position:relative; width:260px; max-width:32vw}
.topbar-search input{
  width:100%; height:36px; padding:0 36px 0 32px; border-radius:8px;
  border:1px solid hsl(var(--input)); background:hsl(var(--background)); font-size:13px; color:hsl(var(--foreground));
}
.topbar-search input:focus{outline:none; border-color:hsl(var(--primary)); box-shadow:0 0 0 2px hsl(var(--primary) / 0.15)}
.topbar-search .search-icon{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; opacity:.5; pointer-events:none}
.search-clear{position:absolute; right:6px; top:50%; transform:translateY(-50%); width:24px; height:24px; border-radius:8px; border:0; background:hsl(var(--muted)); color:hsl(var(--muted-foreground)); display:grid; place-items:center; cursor:pointer; font-size:14px}
.search-clear.hidden{display:none}
.search-clear:hover{background:hsl(var(--accent))}

/* 按钮 500 字重 多蓝 */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:36px; padding:8px 14px; border-radius:8px; border:1px solid hsl(var(--border));
  font-size:13px; font-weight:500; cursor:pointer; transition: all .15s ease;
}
.btn:active{transform:scale(0.97)}
.btn-primary{background:hsl(var(--primary)); color:hsl(var(--primary-foreground)); border-color:hsl(var(--primary))}
.btn-primary:hover{background:hsl(var(--primary) / 0.9)}
.btn-secondary{background:hsl(var(--card)); color:hsl(var(--foreground)); border:1px solid hsl(var(--border))}
.btn-secondary:hover{background:hsl(var(--muted) / 0.5)}
.btn-ghost{background:transparent; border:0; color:hsl(var(--muted-foreground))}
.btn-ghost:hover{background:hsl(var(--muted))}

/* 14 外密16 */
.content{padding:16px 24px 24px; max-width:1200px; width:100%; margin:0 auto}
.toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 12px}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  font-size:12px; font-weight:500; padding:6px 10px; border-radius:8px;
  border:1px solid hsl(var(--border)); background:hsl(var(--card)); color:hsl(var(--muted-foreground));
  cursor:pointer; transition: all .15s ease;
}
.chip:hover{border-color:hsl(var(--primary) / 0.3); color:hsl(var(--foreground))}
.chip.active{background:hsl(var(--primary)); color:hsl(var(--primary-foreground)); border-color:hsl(var(--primary)); font-weight:600}
.toolbar-count{font-size:12px; color:hsl(var(--muted-foreground))}

/* 16 行式 h16 + 6/17 多蓝多圆角阴影 */
.list{border:1px solid hsl(var(--border)); border-radius:12px; overflow:hidden; background:hsl(var(--card)); box-shadow: 0 1px 2px rgba(0,0,0,0.04)}
.list-row{
  display:flex; align-items:center; gap:12px; padding:10px 16px; min-height:64px;
  border-bottom:1px solid hsl(var(--border)); background:hsl(var(--card));
  cursor:pointer; transition: background .15s ease;
}
.list-row:last-child{border-bottom:0}
.list-row:hover{background:hsl(var(--muted) / 0.5)}
.list-row:active{background:hsl(var(--muted))}
.list-icon{width:36px; height:36px; border-radius:8px; background:hsl(var(--muted)); border:1px solid hsl(var(--border)); display:grid; place-items:center; flex-shrink:0; font-size:12px; font-weight:600; color:hsl(var(--muted-foreground))}
.list-main{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.list-name{font-size:14px; font-weight:500; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.list-desc{font-size:12px; color:hsl(var(--muted-foreground)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.list-tags{display:flex; gap:4px; flex-wrap:wrap; margin-top:2px}
.tag{font-size:10px; font-weight:500; padding:2px 6px; border-radius:9999px; background:hsl(var(--secondary)); color:hsl(var(--secondary-foreground)); border:1px solid hsl(var(--border))}
.badge{font-size:11px; font-weight:600; padding:3px 8px; border-radius:6px; flex-shrink:0; border:1px solid transparent}
.list-meta{font-size:11px; color:hsl(var(--muted-foreground)); text-align:right; flex-shrink:0; display:flex; flex-direction:column; gap:2px; align-items:flex-end}
.gauge{display:flex; align-items:center; gap:3px}
.gauge-dot{width:6px; height:6px; border-radius:50%; background:hsl(var(--border))}
.gauge-line{width:12px; height:2px; border-radius:1px; background:hsl(var(--border))}
.empty{text-align:center; padding:48px 20px; color:hsl(var(--muted-foreground)); border:1px dashed hsl(var(--border)); border-radius:12px; background:hsl(var(--muted) / 0.3)}
.empty h3{font-size:16px; font-weight:600; color:hsl(var(--foreground)); margin:0 0 8px}
.empty p{font-size:13px; margin:0 0 16px}

/* 表单 */
.field{margin-bottom:12px}
.field label{display:block; font-size:11px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:hsl(var(--muted-foreground)); margin-bottom:6px}
.field input,.field textarea,.field select{
  width:100%; min-height:36px; padding:8px 10px; border-radius:8px; border:1px solid hsl(var(--input)); background:hsl(var(--background)); font-size:13px; outline:none;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:hsl(var(--ring)); box-shadow:0 0 0 2px hsl(var(--ring) / 0.15)}
.field textarea{resize:vertical; min-height:80px}

/* 全屏设置：仿 CC Switch Dialog variant fullscreen + App.tsx currentView=settings */
.overlay{position:fixed; inset:0; background:hsl(var(--background)); display:none; flex-direction:column; z-index:50; padding:28px 0 0}
.overlay.show{display:flex; animation: overlayIn .2s ease}
@keyframes overlayIn{ from{opacity:0} to{opacity:1} }
.drawer{
  flex:1; width:100%; height:100%; overflow:hidden; display:flex; flex-direction:column;
  background:hsl(var(--background)); border:0; border-radius:0; box-shadow:none;
  transform: none; opacity:1; padding:0;
}
.drawer-head{flex-shrink:0; display:flex; justify-content:space-between; align-items:center; gap:12px; height:64px; padding:0 24px; border-bottom:1px solid hsl(var(--border)); background:hsl(var(--muted) / 0.2)}
.drawer-head h2{font-size:18px; font-weight:600; letter-spacing:-0.01em}
.drawer-close{width:36px; height:36px; border-radius:8px; border:1px solid hsl(var(--border)); background:hsl(var(--card)); cursor:pointer; display:grid; place-items:center; font-size:18px; color:hsl(var(--muted-foreground))}
.drawer-close:hover{background:hsl(var(--muted))}
.drawer-body{flex:1; overflow-y:auto; overflow-x:hidden; padding:24px; padding-right:16px}
.drawer-body::-webkit-scrollbar{width:6px}
.drawer-body::-webkit-scrollbar-thumb{background:hsl(var(--border)); border-radius:9999px}
.settings-tabs{display:flex; gap:4px; margin-bottom:16px; padding:4px; background:hsl(var(--muted)); border-radius:8px}
.settings-tab{flex:1; font-size:12px; font-weight:500; padding:8px 12px; border-radius:6px; border:0; background:transparent; color:hsl(var(--muted-foreground)); cursor:pointer}
.settings-tab.active{background:hsl(var(--background)); color:hsl(var(--foreground)); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,0.06)}
.sync-preview{font-size:11px; line-height:1.6; color:hsl(var(--muted-foreground)); background:hsl(var(--muted) / 0.5); border:1px solid hsl(var(--border)); border-radius:8px; padding:10px 12px; margin-top:8px}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:hsl(var(--foreground)); color:hsl(var(--background)); padding:10px 16px; border-radius:9999px; font-size:12px; font-weight:500; z-index:100; opacity:0; pointer-events:none; transition: opacity .2s, transform .2s}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px)}
.hidden{display:none !important}
.prompt-card{background:hsl(var(--card)); border:1px solid hsl(var(--border)); border-radius:8px; padding:12px; margin-bottom:8px}
.prompt-card pre{background:hsl(var(--muted) / 0.5); border:1px solid hsl(var(--border)); border-radius:6px; padding:8px; font-family:ui-monospace, Menlo, monospace; font-size:12px; white-space:pre-wrap; max-height:140px; overflow:auto; margin:0 0 8px}

/* usage 板（18 轻量） */
.usage-bar{display:flex; gap:12px; margin-bottom:16px; padding:12px 16px; background:hsl(var(--card)); border:1px solid hsl(var(--border)); border-radius:12px; box-shadow:0 1px 2px rgba(0,0,0,0.04)}
.usage-stat{flex:1; text-align:center}
.usage-stat b{font-size:18px; font-weight:600}
.usage-stat span{font-size:11px; color:hsl(var(--muted-foreground))}

@media (max-width: 860px){
  .topbar{padding:0 12px}
  .topbar-center{display:none !important}
  .content{padding:12px 16px 24px}
  .drawer{width:100%}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; transition-duration:.01ms !important}
}
</style>
</head>
<body>
<a href="#main" class="skip-link">跳至主内容</a>
<div class="drag-bar" data-tauri-drag-region></div>
<div class="app-shell">
  <div class="main" id="main">
    <div class="topbar" id="topbar">
      <div class="topbar-left">
        <div class="topbar-logo">A</div>
        <div>
          <div class="topbar-title">Agent Workbench</div>
          <div class="topbar-meta" id="topbarMeta">全部 · 0 个项目</div>
        </div>
      </div>
      <div class="topbar-center">
        <div class="stage-pill-wrap" id="stagePillWrap">
          <div class="stage-pill" id="stagePill"></div>
          <div class="stage-popover hidden" id="stageMorePopover"></div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="topbar-search">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16 16l4 4"/></svg>
          <input type="text" id="searchInput" placeholder="搜索项目…” aria-label="搜索">
          <button class="search-clear hidden" id="searchClear" aria-label="清除">×</button>
        </div>
        <button class="btn btn-primary" id="addProjectBtn" title="新建项目" aria-label="新建项目" style="width:36px; height:36px; padding:0; border-radius:8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="btn btn-secondary" id="importJsonBtn" title="导入本机项目" aria-label="导入本机项目" style="width:36px; height:36px; padding:0; border-radius:8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
        <button class="btn btn-secondary" id="settingsBtn" title="设置" aria-label="设置" style="width:36px; height:36px; padding:0; border-radius:8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.10a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>

    <div class="content">
      <!-- 18 usage 轻量看板 -->
      <div class="usage-bar" id="usageBar">
        <div class="usage-stat"><b id="usageTotal">0</b><br><span>项目</span></div>
        <div class="usage-stat"><b id="usagePrompts">0</b><br><span>Prompts</span></div>
        <div class="usage-stat"><b id="usageLive">0</b><br><span>已上线</span></div>
        <div class="usage-stat"><b id="usageProxy">●</b><br><span>代理</span></div>
      </div>

      <div class="toolbar">
        <div class="chips" id="filterChips"></div>
        <span class="toolbar-count" id="toolbarCount"></span>
      </div>
      <div id="gridArea"></div>
    </div>
  </div>
</div>

<div id="onboardScreen" class="hidden" style="display:none;"></div>
<div class="hidden"><input id="ob-url"><input id="ob-token"><button id="ob-connect"></button><div id="onboardError"></div></div>
<div class="overlay" id="overlay"><div class="drawer" id="drawer"></div></div>
<div class="toast" id="toast"></div>

<script>
const STAGES = [
  { key: 'idea',     label: '构思中', color: '#d97706', bg: '#fef3c7' },
  { key: 'building', label: '开发中', color: '#2563eb', bg: '#dbeafe' },
  { key: 'testing',  label: '测试中', color: '#7c3aed', bg: '#ede9fe' },
  { key: 'live',     label: '已上线', color: '#059669', bg: '#d1fae5' },
];
const SETTINGS_KEY = 'workbench-settings';
const CACHE_KEY = 'workbench-cache';

let settings = null;
let syncStatus = 'idle';
let pushTimer = null;
let settingsTab = 'general';

  ja: {

function getInitialLanguage(){
  try{
    const s=localStorage.getItem('language');
    if(s==='zh'||s==='zh-TW'||s==='en'||s==='ja') return s;
  }catch(e){}
  const nav=(navigator.language||'').toLowerCase();
  if(nav.startsWith('zh-tw')||nav.startsWith('zh-hk')||nav.startsWith('zh-mo')||nav.startsWith('zh-hant')) return 'zh-TW';
  if(nav.startsWith('zh')) return 'zh';
  if(nav.startsWith('ja')) return 'ja';
  if(nav.startsWith('en')) return 'en';
  return 'zh';
}
let currentLang=getInitialLanguage();
function t(path){
  const parts=path.split('.');
  let cur=I18N[currentLang];
  for(const p of parts){ if(cur && cur[p]!==undefined) cur=cur[p]; else return path; }
  return typeof cur==='string'?cur:path;
}
function setLanguage(lang){
  if(!['zh','zh-TW','en','ja'].includes(lang)) return;
  localStorage.setItem('language', lang);
  currentLang=lang;
  document.documentElement.lang=lang;
  render();
  renderSettingsDrawer();
  showToast(t('settings.language')+': '+lang);
}

// ===== Theme（对标 CC Switch theme-provider  light/dark/system 立即生效）=====
function getInitialTheme(){
  try{
    const s=localStorage.getItem('cc-switch-theme')||localStorage.getItem('workbench-theme');
    if(s==='light'||s==='dark'||s==='system') return s;
  }catch(e){}
  return 'system';
}
let currentTheme=getInitialTheme();
function applyTheme(theme){
  if(!['light','dark','system'].includes(theme)) return;
  localStorage.setItem('cc-switch-theme', theme);
  localStorage.setItem('workbench-theme', theme);
  currentTheme=theme;
  const root=document.documentElement;
  root.classList.remove('light','dark');
  if(theme==='system'){
    const isDark=window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.classList.add(isDark?'dark':'light');
    // 通知 Tauri 原生标题栏跟随系统（与 CC 同步）
    try{ if(window.__TAURI__ && window.__TAURI__.invoke) window.__TAURI__.invoke('set_window_theme',{theme:'system'}).catch(()=>{}); }catch(e){}
  } else {
    root.classList.add(theme);
    try{ if(window.__TAURI__ && window.__TAURI__.invoke) window.__TAURI__.invoke('set_window_theme',{theme}).catch(()=>{}); }catch(e){}
  }
}
applyTheme(currentTheme);
if(window.matchMedia){
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  mq.addEventListener('change', ()=>{
    if(currentTheme==='system') applyTheme('system');
  });
}

function hasSyncSettings(){ return !!(settings && settings.url && settings.token); }
function clearSyncSettings(){ settings=null; localStorage.removeItem(SETTINGS_KEY); setSyncStatus('idle'); }
function cacheLocally(projects){ localStorage.setItem(CACHE_KEY, JSON.stringify({projects, cachedAt:new Date().toISOString()})); }
function readCache(){ try{ return JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){ return null; } }
function apiUrl(path){ return settings.url.replace(/\/+$/,'')+path; }
async function apiGet(){ if(!hasSyncSettings()) throw new Error('no sync'); const r=await fetch(apiUrl('/api/state'),{headers:{'X-Sync-Token':settings.token}}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function apiPut(projects){ if(!hasSyncSettings()) throw new Error('no sync'); const r=await fetch(apiUrl('/api/state'),{method:'PUT',headers:{'Content-Type':'application/json','X-Sync-Token':settings.token},body:JSON.stringify({projects})}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function pullFromServer(showToastOnSuccess){
  if(!hasSyncSettings()){ setSyncStatus('idle'); return; }
  setSyncStatus('syncing');
  try{
    const data=await apiGet();
    state.projects=data.projects||[]; state.loaded=true; cacheLocally(state.projects);
    setSyncStatus('ok', data.updatedAt); render(); if(showToastOnSuccess) showToast('已同步最新数据');
  }catch(e){
    const cache=readCache();
    if(cache) { state.projects=cache.projects; state.loaded=true; }
    else if(!state.loaded){ state.projects=[]; state.loaded=true; }
    setSyncStatus('offline'); render();
  }
}
function scheduleAutoPush(){ clearTimeout(pushTimer); pushTimer=setTimeout(pushToServer,500); }
async function pushToServer(){
  cacheLocally(state.projects);
  if(!hasSyncSettings()){ setSyncStatus('idle'); return; }
  setSyncStatus('syncing');
  try{ const res=await apiPut(state.projects); setSyncStatus('ok', res.updatedAt); }
  catch(e){ setSyncStatus('offline'); showToast('同步失败，已保存在本地，联网后会自动重试'); }
}

function setSyncStatus(status, updatedAt){
  const el=document.getElementById('usageProxy');

    else if(status==='ok') el.textContent='●';
    else if(status==='offline') el.textContent='○';
    else el.textContent='●';
    el.style.color=status==='ok'?'#059669':status==='offline'?'#d97706':'hsl(var(--muted-foreground))';
  }
}

function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function stageInfo(key){ return STAGES.find(s=>s.key===key)||STAGES[0]; }
function stageIndex(key){ return STAGES.findIndex(s=>s.key===key); }
function esc(str){ const d=document.createElement('div'); d.textContent=str??''; return d.innerHTML; }
function relTime(iso){
  if(!iso) return '';
  const diff=Date.now()-new Date(iso).getTime();
  const min=Math.floor(diff/60000);
  if(min<1) return '刚刚';
  if(min<60) return min+' 分钟前';
  const hr=Math.floor(min/60);
  if(hr<24) return hr+' 小时前';
  const day=Math.floor(hr/24);
  if(day<30) return day+' 天前';
  return new Date(iso).toLocaleDateString('zh-CN');
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer=setTimeout(()=>t.classList.remove('show'),2200);
}

  el.innerHTML=pills.map(s=>`<button class="chip ${state.filterStage===s.key?'active':''}" data-stage="${s.key}">${s.label}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{ state.filterStage=b.dataset.stage; render(); }));
}
function renderStagePill(){
  const pill=document.getElementById('stagePill');
  const popover=document.getElementById('stageMorePopover');
  const wrap=document.getElementById('stagePillWrap');
  if(!pill||!wrap) return;
  const stages=[{key:'all',label:t('stages.all')},...STAGES.map(s=>({key:s.key,label:t('stages.'+s.key)})),{key:'paused',label:t('stages.paused')}];
  pill.innerHTML='';
  popover.innerHTML='';
  popover.classList.add('hidden');
  const btns=stages.map(s=>{
    const b=document.createElement('button');
    b.className='stage-pill-item'+(state.filterStage===s.key?' active':'');
    b.dataset.stage=s.key;
    b.textContent=s.label;
    b.addEventListener('click',()=>{ state.filterStage=s.key; render(); closeMore(); });
    return b;
  });
  const moreBtn=document.createElement('button');
  moreBtn.className='stage-pill-item stage-more-trigger hidden';
  moreBtn.textContent='⋯';
  moreBtn.addEventListener('click',(e)=>{ e.stopPropagation(); popover.classList.toggle('hidden'); });
  pill.append(...btns, moreBtn);
  function layout(){
    while(popover.firstChild){ pill.insertBefore(popover.firstChild, moreBtn); }
    moreBtn.classList.add('hidden');
    popover.classList.add('hidden');
    if(pill.scrollWidth <= wrap.clientWidth) return;
    moreBtn.classList.remove('hidden');
    const activeKey=state.filterStage;
    for(let i=btns.length-1; i>=0 && pill.scrollWidth > wrap.clientWidth; i--){
      const b=btns[i];
      if(b.dataset.stage===activeKey) continue;
      popover.insertBefore(b, popover.firstChild);
    }
    for(let i=btns.length-1; i>=0 && pill.scrollWidth > wrap.clientWidth; i--){
      if(popover.contains(btns[i])) continue;
      popover.insertBefore(btns[i], popover.firstChild);
    }
    if(popover.children.length===0) moreBtn.classList.add('hidden');
  }
  layout();
  if(!wrap._ro){
    if(typeof ResizeObserver !== 'undefined'){
      try{
        const ro=new ResizeObserver(()=>layout());
        ro.observe(wrap);
        wrap._ro=ro;
      }catch(e){}
    }
    window.addEventListener('resize', layout);
  }
  if(!wrap._outside){
    document.addEventListener('click',(e)=>{ if(!wrap.contains(e.target)) closeMore(); });
    wrap._outside=true;
  }
  function closeMore(){ popover.classList.add('hidden'); }
}
function filteredProjects(){
  return state.projects

      <div class="field"><label>版本号</label><input type="text" id="pf-version" value="${nextVersion}"></div>
      <div class="field"><label>Prompt 内容</label><textarea id="pf-content" rows="6" placeholder="在这里写下 / 粘贴 prompt 内容…">${existing?esc(existing.content):''}</textarea></div>
      <div class="field"><label>备注</label><input type="text" id="pf-notes" value="${existing?esc(existing.notes||''):''}" placeholder="这版改了什么、效果如何…"></div>
      <div style="display:flex;gap:8px;"><button class="btn btn-primary" id="pf-save" style="flex:1;">${existing?'保存修改':'添加'}</button><button class="btn btn-secondary" id="pf-cancel">取消</button></div>
    </div>`;
  document.getElementById('pf-cancel').addEventListener('click',()=>{ slot.innerHTML=''; });
  document.getElementById('pf-save').addEventListener('click',()=>{
    const title=document.getElementById('pf-title').value.trim();
    const content=document.getElementById('pf-content').value.trim();
    if(!title||!content){ showToast('标题和内容都要填写'); return; }
    const version=parseFloat(document.getElementById('pf-version').value)||nextVersion;
    const notes=document.getElementById('pf-notes').value.trim();
    const proj=state.projects.find(x=>x.id===projectId);
    if(existing){ Object.assign(existing,{title,content,version,notes}); }
    else{ proj.prompts=proj.prompts||[]; proj.prompts.push({id:uid('pr'),title,content,version,notes,isCurrent:proj.prompts.length===0,createdAt:new Date().toISOString()}); }
    proj.updatedAt=new Date().toISOString();
    saveData(); slot.innerHTML='';
    document.getElementById('promptList').innerHTML=renderPromptList(proj);
    bindPromptListEvents(projectId);
    render(); showToast(existing?'Prompt 已更新':'Prompt 已添加');
  });
}
function setCurrentPrompt(projectId,promptId){
  const p=state.projects.find(x=>x.id===projectId);
  p.prompts.forEach(pr=>pr.isCurrent=(pr.id===promptId));
  p.updatedAt=new Date().toISOString();
  saveData();
  document.getElementById('promptList').innerHTML=renderPromptList(p);
  bindPromptListEvents(projectId); render();
}
function deletePrompt(projectId,promptId){
  if(!confirm('确定删除这条 Prompt 吗？')) return;
  const p=state.projects.find(x=>x.id===projectId);
  p.prompts=p.prompts.filter(pr=>pr.id!==promptId);
  if(p.prompts.length&&!p.prompts.some(pr=>pr.isCurrent)) p.prompts[0].isCurrent=true;
  p.updatedAt=new Date().toISOString();
  saveData();
  document.getElementById('promptList').innerHTML=renderPromptList(p);
  bindPromptListEvents(projectId); render(); showToast('已删除');
}
function saveDetailFields(id){
  const p=state.projects.find(x=>x.id===id);
  p.name=document.getElementById('d-name').value.trim()||p.name;
  p.description=document.getElementById('d-desc').value.trim();
  p.stage=document.getElementById('d-stage').value;
  p.tags=document.getElementById('d-tags').value.split(',').map(t=>t.trim()).filter(Boolean);
  p.paused=document.getElementById('d-paused').checked;
  p.updatedAt=new Date().toISOString();
  saveData(); render(); showToast('已保存');
}
function deleteProject(id){
  if(!confirm('确定删除整个项目吗？这会同时删除它下面的所有 Prompt，且无法恢复。')) return;
  state.projects=state.projects.filter(p=>p.id!==id);
  saveData(); closeOverlay(); render(); showToast('项目已删除');
}
function openOverlay(){ document.getElementById('overlay').classList.add('show'); }
function closeOverlay(){ document.getElementById('overlay').classList.remove('show'); }
function updateSearchClear(){
  const inp=document.getElementById('searchInput');
  const btn=document.getElementById('searchClear');
  if(!inp||!btn) return;
  if(inp.value) btn.classList.remove('hidden'); else btn.classList.add('hidden');
}
document.getElementById('overlay').addEventListener('click',(e)=>{ if(e.target.id==='overlay') closeOverlay(); });
document.getElementById('addProjectBtn').addEventListener('click',()=>openCreateModal());
const searchInput=document.getElementById('searchInput');
searchInput.addEventListener('input',(e)=>{ state.search=e.target.value; updateSearchClear(); render(); });
document.getElementById('searchClear').addEventListener('click',()=>{ searchInput.value=''; state.search=''; updateSearchClear(); render(); searchInput.focus(); });
document.addEventListener('keydown',(e)=>{
  const isMod=e.metaKey||e.ctrlKey;
  if(isMod && (e.key==='k' || e.key==='K' || e.key==='f' || e.key==='F')){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
    e.preventDefault(); searchInput.focus();
  }
  if(e.key==='Escape'){
    if(document.activeElement===searchInput && searchInput.value){ searchInput.value=''; state.search=''; updateSearchClear(); render(); }
    if(document.getElementById('overlay').classList.contains('show')) closeOverlay();
  }
});
document.getElementById('importJsonBtn').addEventListener('click', async()=>{
  try{
    const r=await fetch('./projects.json', {cache:'no-store'});
    if(!r.ok) throw new Error('no file');
    const d=await r.json();
    if(!Array.isArray(d.projects)) throw new Error('bad format');
    if(!confirm(`导入扫描到的 ${d.projects.length} 个项目？这将覆盖本地当前 ${state.projects.length} 个项目。`)) return;
    state.projects=d.projects;
    cacheLocally(state.projects);
    state.loaded=true;
    render();
    showToast(`已导入 ${d.projects.length} 个项目`);
    if(hasSyncSettings() && confirm('是否立即推送到云端同步？')) pushToServer();
  }catch(e){ showToast('导入失败: '+e.message); }
});
const syncNowBtn=document.getElementById('syncNowBtn');
if(syncNowBtn) syncNowBtn.addEventListener('click',()=>{ if(!hasSyncSettings()){ openSyncSettings('尚未设置同步，请先在设置中填入 Worker 地址和密钥'); return; } pullFromServer(true); });
const settingsBtnEl=document.getElementById('settingsBtn');
if(settingsBtnEl) settingsBtnEl.addEventListener('click',()=>openSyncSettings());
window.addEventListener('focus',()=>{ if(hasSyncSettings()&&state.loaded) pullFromServer(false); });
setInterval(()=>{ if(hasSyncSettings()&&state.loaded) pullFromServer(false); },60000);
(function initTauriEvents(){
  try{
    const tauriEvent = window.__TAURI__ && window.__TAURI__.event;
    if(tauriEvent && tauriEvent.listen){
      tauriEvent.listen('stage-switch', (e)=>{ const s=e.payload; if(typeof s==='string'){ state.filterStage=s; render(); showToast('已切换到 '+ (stageInfo(s).label||s)); }});
      tauriEvent.listen('deeplink-import', (e)=>{
        const raw=typeof e.payload==='string'?e.payload:e.payload;
        try{
          const url=new URL(raw);
          const q=url.searchParams;
          const syncUrl=q.get('url')||q.get('worker')||'';
          const token=q.get('token')||'';
          if(syncUrl && token){
            settings={url:syncUrl, token: token};
            saveSettings(settings);
            showToast('已通过 DeepLink 导入同步配置');
            pullFromServer(true);
          } else {
            showToast('DeepLink: '+raw);
          }
        }catch(err){ showToast('DeepLink 导入失败: '+raw); }
      });
    }
  }catch(e){}
})();
(async function boot(){
  settings=loadSettings();
  const cache=readCache();
  if(cache&&Array.isArray(cache.projects) && cache.projects.length>0){ state.projects=cache.projects; }
  else {
    try{
      const r=await fetch('./projects.json', {cache:'no-store'});
      if(r.ok){
        const d=await r.json();
        if(Array.isArray(d.projects) && d.projects.length){
          state.projects=d.projects;
          cacheLocally(state.projects);
        } else { state.projects=[]; }
      } else { state.projects=[]; }
    }catch(e){ state.projects=[]; }
    if(!state.projects.length && cache&&Array.isArray(cache.projects)) state.projects=cache.projects;
  }
  state.loaded=true;
  render();
  if(hasSyncSettings()){ setSyncStatus('syncing'); await pullFromServer(false); } else { setSyncStatus('idle'); }
})();
</script>
</body>
</html>
