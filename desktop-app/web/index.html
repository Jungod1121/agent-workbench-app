<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Workbench</title>
<link rel="stylesheet" href="./assets/apple-tokens.css">
<link rel="stylesheet" href="./assets/apple-gradients.css">
<style>
/* ——— Apple 软件 UI · 240 侧栏 + 主区 + 玻璃工具栏（暗色系）——— */
body {
  background: #0c0c0e;
  color: #f5f5f7;
}
#lgScene { position: relative; min-height: 100vh; isolation: isolate; background: #0c0c0e; }
.bg-wells { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.bg-wells::before {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(640px 420px at 18% 14%, rgba(0,102,204,0.22), transparent 68%),
    radial-gradient(600px 400px at 88% 18%, rgba(164,120,199,0.18), transparent 70%),
    radial-gradient(700px 460px at 52% 90%, rgba(253,159,89,0.16), transparent 74%),
    radial-gradient(520px 360px at 50% 50%, rgba(45,212,191,0.08), transparent 72%);
}
.app-shell { display: flex; min-height: 100vh; position: relative; z-index: 1; padding: 12px; gap: 16px; }
/* 侧栏：暗色内收玻璃岛（T3 thick 深色） */
.sidebar {
  width: 240px; flex-shrink: 0;
  position: sticky; top: 12px; height: calc(100vh - 24px); height: calc(100dvh - 24px);
  display: flex; flex-direction: column;
  padding: 18px 14px 16px;
  gap: 14px;
  overflow: visible;
  border-radius: 16px;
  border: none;
  background: transparent;
}
.sidebar:not([data-liquid-glass]) {
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(39,39,41,0.92);
}
.sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 4px 4px 2px; }
.sidebar-logo {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  background: var(--apx-blue); color: #fff; display: grid; place-items: center;
  font-family: var(--apx-font); font-size: 14px; font-weight: 700; letter-spacing: -0.02em;
}
.sidebar-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; color: #f5f5f7; }
.sidebar-sub { font-size: 11px; color: #86868b; letter-spacing: -0.01em; }
.sidebar-nav { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
.sidebar-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 9px 10px; border-radius: 10px; font-size: 13px; font-weight: 500;
  color: #f5f5f7; cursor: pointer; border: 1px solid transparent;
  transition: background 0.2s, border-color 0.2s; user-select: none;
}
.sidebar-item:hover { background: rgba(255,255,255,0.06); }
.sidebar-item.active { background: #fff; color: #1d1d1f; border-color: #fff; }
.sidebar-item .count { font-family: var(--apx-font); font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 9999px; background: rgba(255,255,255,0.10); color: #86868b; }
.sidebar-item.active .count { background: rgba(0,0,0,0.08); color: #1d1d1f; }
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.08); }
.sidebar-foot { border-top-color: rgba(255,255,255,0.08); }
.sync-pill {
  display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px;
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.10);
  font-size: 11px; line-height: 1.4; color: #86868b;
}
.sync-pill .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.ok { background: #2F8F5D; } .dot.warn { background: #B4791F; } .dot.idle { background: var(--apx-muted); } .dot.busy { background: var(--apx-blue); animation: pulse 1s infinite ease-in-out; } .dot.off { background: #B4432F; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* 主区 — 暗色单底 */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: transparent; border-radius: 16px; overflow: hidden; border: none; }
/* 顶栏：T0 暗色磨砂 52px */
.topbar {
  position: sticky; top: 0; z-index: 10; height: 52px;
  display: flex; align-items: center; gap: 12px; padding: 0 20px;
  background: rgba(22,22,23,0.72); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.topbar[data-liquid-glass] { background: rgba(245,245,247,0.42) !important; }
.topbar-title { font-size: 12px; font-weight: 600; letter-spacing: -0.01em; color: #f5f5f7; white-space: nowrap; }
.topbar-search { flex: 1; max-width: 420px; position: relative; }
.topbar-search input {
  width: 100%; height: 36px; padding: 0 12px 0 32px; border-radius: 9999px;
  border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.08); font-size: 13px; color: #f5f5f7;
}
.topbar-search input::placeholder { color: #86868b; }
.topbar-search input:focus { outline: 2px solid var(--apx-blue-focus); outline-offset: 1px; background: rgba(255,255,255,0.12); }
.topbar-search::before {
  content: "⌕"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  font-size: 13px; color: var(--apx-muted); pointer-events: none;
}
.apx-btn { min-height: 36px; padding: 8px 16px; font-size: 13px; }
.apx-btn-primary { background: var(--apx-blue); color: #fff; }
.apx-btn-utility { background: rgba(255,255,255,0.10); color: #f5f5f7; border: 1px solid rgba(255,255,255,0.10); }
.content { padding: 20px 20px 40px; max-width: 1080px; width: 100%; margin: 0 auto; }

/* 保留原功能样式，但用 Apple 令牌重肤 */
.stats { display: flex; gap: 6px; flex-wrap: wrap; }
.stat-pill { font-size: 11px; padding: 6px 10px; border-radius: 9999px; border: 1px solid var(--apx-hairline); background: #fff; color: var(--apx-muted); }
.stat-pill b { color: var(--apx-ink); font-weight: 600; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 14px 0 18px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  font-size: 12px; padding: 7px 12px; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.10);
  background: rgba(255,255,255,0.08); color: #86868b; cursor: pointer; transition: all 0.2s;
}
.chip:hover { border-color: rgba(255,255,255,0.18); color: #f5f5f7; }
.chip.active { background: #fff; color: #1d1d1f; border-color: #fff; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.card {
  background: rgba(39,39,41,0.92); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px;
  padding: 16px; cursor: pointer; transition: transform 0.3s var(--apx-spring), box-shadow 0.3s;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,0,0,0.32); border-color: rgba(255,255,255,0.12); }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.card-name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; color: #f5f5f7; }
.badge { font-size: 11px; padding: 3px 8px; border-radius: 9999px; font-weight: 600; }
.card-desc { color: #86868b; font-size: 13px; line-height: 1.45; margin: 0 0 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 18px; }
.gauge { display: flex; align-items: center; gap: 4px; margin-bottom: 10px; }
.gauge-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; background: rgba(255,255,255,0.14); }
.gauge-line { flex: 1; height: 2px; border-radius: 1px; background: rgba(255,255,255,0.14); }
.gauge-label { font-size: 10px; color: #86868b; margin-left: 4px; }
.card-foot { display: flex; justify-content: space-between; font-size: 11px; color: #86868b; }
.tag-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.tag { font-size: 10px; padding: 3px 7px; border-radius: 9999px; background: rgba(255,255,255,0.08); color: #f5f5f7; border: 1px solid rgba(255,255,255,0.08); }
.paused-ribbon { position: absolute; top: 12px; right: -28px; background: #86868b; color: #fff; font-size: 10px; font-weight: 600; padding: 3px 30px; transform: rotate(38deg); }
.empty { text-align: center; padding: 64px 20px; color: #86868b; }
.empty h3 { font-size: 19px; font-weight: 600; color: #f5f5f7; margin: 0 0 8px; }
.field label { font-size: 11px; color: #86868b; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600; }
.field input, .field textarea, .field select { border-radius: 10px; border: 1px solid rgba(255,255,255,0.10); background: rgba(255,255,255,0.06); color: #f5f5f7; }
.field input::placeholder, .field textarea::placeholder { color: #6e6e73; }
.btn { border-radius: 9999px; }
.btn:active, .apx-btn:active { transform: scale(0.97); }
/* 抽屉：T3 regular 暗色玻璃浮层 */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.48); display: none; align-items: stretch; justify-content: flex-end; z-index: 50; padding: 12px; }
.overlay.show { display: flex; }
.drawer {
  width: min(560px, 100%); background: rgba(39,39,41,0.96); height: calc(100% - 24px); height: calc(100dvh - 24px); overflow-y: auto;
  padding: 22px 22px 60px; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; position: relative;
  box-shadow: 0 16px 48px rgba(0,0,0,0.44); color: #f5f5f7;
}
.drawer[data-liquid-glass] { background: rgba(28,28,30,0.72) !important; border: none !important; box-shadow: none !important; }
.settings-tabs { display: flex; gap: 6px; margin-bottom: 16px; border-bottom: 1px solid var(--apx-hairline); padding-bottom: 12px; }
.settings-tab { font-size: 12px; padding: 7px 12px; border-radius: 9999px; border: 1px solid var(--apx-hairline); background: #fff; color: var(--apx-muted); cursor: pointer; }
.settings-tab.active { background: var(--apx-ink); color: #fff; border-color: var(--apx-ink); }
.sync-preview { font-size: 11px; line-height: 1.6; color: var(--apx-muted); background: #fff; border: 1px solid var(--apx-hairline); border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--apx-ink); color: #fff; padding: 10px 16px; border-radius: 9999px; font-size: 12px; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }
.hidden { display: none !important; }
@media (max-width: 860px) {
  .sidebar { display: none; }
  .topbar { padding: 0 12px; }
  .content { padding: 16px 12px 40px; }
  .drawer { width: 100%; }
}
</style>
</head>
<body>

<div id="lgScene" data-lg-scene>
  <div class="bg-wells" aria-hidden="true"></div>

  <div class="app-shell">
    <!-- 侧栏：240 内收玻璃岛 暗色 T3 thick -->
    <aside class="sidebar" id="sidebar" data-liquid-glass data-lg-preset="thick" style="border-radius:16px;">
      <div class="sidebar-brand">
        <div class="sidebar-logo">A</div>
        <div>
          <div class="sidebar-title apx-grad-text-9">Agent Workbench</div>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebarNav">
        <!-- 由 JS 渲染：全部/构思/开发/测试/已上线/已暂停 -->
      </nav>

      <div id="sidebarStats" class="stats" style="padding: 4px 2px;"></div>

      <div class="sidebar-foot">
        <div class="sync-pill" id="syncPill">
          <span class="dot idle" id="connDot"></span>
          <span id="connText" style="flex:1;">本地模式 · 未设置同步</span>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="apx-btn apx-btn-utility" id="syncNowBtn" style="flex:1; min-height:36px; font-size:12px;">立即同步</button>
          <button class="apx-btn apx-btn-utility" id="settingsBtn" style="flex:1; min-height:36px; font-size:12px; background:#fff; color:var(--apx-ink); border:1px solid var(--apx-hairline);">设置</button>
        </div>
      </div>
    </aside>

    <!-- 主区 -->
    <div class="main">
      <!-- 顶栏：T0 官网磨砂 52px -->
      <div class="topbar" id="topbar">
        <div class="topbar-title">项目</div>
        <div class="topbar-search"><input type="text" id="searchInput" placeholder="搜索项目名称 / 标签…"></div>
        <button class="apx-btn apx-btn-primary" id="addProjectBtn">+ 新建项目</button>
      </div>

      <div class="content">
        <div class="toolbar" style="margin-top:4px;">
          <div class="chips" id="filterChips"></div>
        </div>
        <div id="gridArea"></div>
      </div>
    </div>
  </div>
</div>

<!-- 兼容旧 onboarding 结构（永不拦截） -->
<div id="onboardScreen" class="hidden" style="display:none;"></div>
<div class="hidden"><input id="ob-url"><input id="ob-token"><button id="ob-connect"></button><div id="onboardError"></div></div>

<div class="overlay" id="overlay"><div class="drawer" id="drawer" data-liquid-glass data-lg-preset="regular" style="border-radius:0;"></div></div>
<div class="toast" id="toast"></div>

<script src="./assets/liquid-glass.js"></script>
<script src="./assets/liquid-glass-svg.js"></script>
<script>
const STAGES = [
  { key: 'idea',     label: '构思中', color: '#B4791F', bg: '#FBF1DF' },
  { key: 'building', label: '开发中', color: '#2E6FA8', bg: '#E4EEF6' },
  { key: 'testing',  label: '测试中', color: '#6B4FA0', bg: '#EEE8F5' },
  { key: 'live',     label: '已上线', color: '#2F8F5D', bg: '#E3F3EA' },
];
const SETTINGS_KEY = 'workbench-settings';
const CACHE_KEY = 'workbench-cache';

let state = { projects: [], filterStage: 'all', search: '', loaded: false };
let settings = null;
let syncStatus = 'idle';
let pushTimer = null;
let settingsTab = 'general';

function loadSettings() { try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null'); } catch(e){ return null; } }
function saveSettings(s){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }
function hasSyncSettings(){ return !!(settings && settings.url && settings.token); }
function clearSyncSettings(){ settings=null; localStorage.removeItem(SETTINGS_KEY); setSyncStatus('idle'); }
function cacheLocally(projects){ localStorage.setItem(CACHE_KEY, JSON.stringify({projects, cachedAt: new Date().toISOString()})); }
function readCache(){ try{ return JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){return null;} }
function apiUrl(path){ return settings.url.replace(/\/+$/,'')+path; }
async function apiGet(){ if(!hasSyncSettings()) throw new Error('no sync'); const r=await fetch(apiUrl('/api/state'),{headers:{'X-Sync-Token':settings.token}}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }
async function apiPut(projects){ if(!hasSyncSettings()) throw new Error('no sync'); const r=await fetch(apiUrl('/api/state'),{method:'PUT',headers:{'Content-Type':'application/json','X-Sync-Token':settings.token},body:JSON.stringify({projects})}); if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }

async function pullFromServer(showToastOnSuccess){
  if(!hasSyncSettings()){ setSyncStatus('idle'); return; }
  setSyncStatus('syncing');
  try{
    const data=await apiGet();
    state.projects=data.projects||[]; state.loaded=true; cacheLocally(state.projects);
    setSyncStatus('ok', data.updatedAt); render(); if(showToastOnSuccess) showToast('已同步最新数据');
  }catch(e){
    const cache=readCache();
    if(cache) { state.projects=cache.projects; state.loaded=true; }
    else if(!state.loaded){ state.projects=[]; state.loaded=true; }
    setSyncStatus('offline'); render();
  }
}
function scheduleAutoPush(){ clearTimeout(pushTimer); pushTimer=setTimeout(pushToServer,500); }
async function pushToServer(){
  cacheLocally(state.projects);
  if(!hasSyncSettings()){ setSyncStatus('idle'); return; }
  setSyncStatus('syncing');
  try{ const res=await apiPut(state.projects); setSyncStatus('ok', res.updatedAt); }
  catch(e){ setSyncStatus('offline'); showToast('同步失败，已保存在本地，联网后会自动重试'); }
}
async function saveData(){ scheduleAutoPush(); }
function setSyncStatus(status, updatedAt){
  syncStatus=status;
  const dot=document.getElementById('connDot');
  const text=document.getElementById('connText');
  if(!dot) return;
  if(status==='syncing'){ dot.className='dot busy'; text.textContent='同步中…'; }
  else if(status==='ok'){ dot.className='dot ok'; text.textContent='已同步'+(updatedAt?'（'+relTime(updatedAt)+'）':''); }
  else if(status==='offline'){ dot.className='dot warn'; text.textContent='离线 · 显示本地缓存'; }
  else if(status==='idle'){ dot.className='dot idle'; text.textContent=hasSyncSettings()?'未连接':'本地模式 · 未设置同步'; }
  else{ dot.className='dot off'; text.textContent='未连接'; }
}
function showOnboarding(prefillError){ openSyncSettings(prefillError); }
async function connectAndEnter(){
  const url=document.getElementById('ob-url')?.value.trim()||document.getElementById('st-url')?.value.trim();
  const token=document.getElementById('ob-token')?.value.trim()||document.getElementById('st-token')?.value.trim();
  if(!url||!token){ showToast('请填写完整的 Worker 地址和密钥'); return; }
  settings={url,token};
  try{ await apiGet(); saveSettings(settings); showToast('已连接并同步'); await pullFromServer(false); }
  catch(e){ const errBox=document.getElementById('st-error')||document.getElementById('onboardError'); if(errBox){ errBox.textContent='连接失败：'+e.message; errBox.classList.remove('hidden'); } }
}

function openSyncSettings(prefillError){
  settingsTab=hasSyncSettings()?'sync':'general';
  renderSettingsDrawer(prefillError); openOverlay();
  setTimeout(()=>{ if(window.ApxLiquidGlass) window.ApxLiquidGlass.instances.forEach(inst=>inst.markChanged(document.getElementById('drawer'))); },80);
}
function renderSettingsDrawer(prefillError){
  const drawer=document.getElementById('drawer');
  drawer.setAttribute('data-liquid-glass',''); drawer.setAttribute('data-lg-preset','regular');
  const hasSync=hasSyncSettings();
  const cache=readCache(); const localCount=(cache?.projects||state.projects||[]).length;
  drawer.innerHTML=`
    <div class="drawer-head" style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;">
      <h2 style="font-size:20px;font-weight:600;letter-spacing:-0.02em;margin:0;">设置</h2><button class="drawer-close" id="closeBtn" style="background:none;border:0;font-size:22px;cursor:pointer;color:var(--apx-muted);">×</button>
    </div>
    <div class="settings-tabs" style="display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--apx-hairline);padding-bottom:12px;">
      <button class="settings-tab ${settingsTab==='general'?'active':''}" data-tab="general" style="font-size:12px;padding:7px 12px;border-radius:9999px;border:1px solid var(--apx-hairline);background:${settingsTab==='general'?'var(--apx-ink)':'#fff'};color:${settingsTab==='general'?'#fff':'var(--apx-muted)'};cursor:pointer;">通用</button>
      <button class="settings-tab ${settingsTab==='sync'?'active':''}" data-tab="sync" style="font-size:12px;padding:7px 12px;border-radius:9999px;border:1px solid var(--apx-hairline);background:${settingsTab==='sync'?'var(--apx-ink)':'#fff'};color:${settingsTab==='sync'?'#fff':'var(--apx-muted)'};cursor:pointer;">同步</button>
    </div>
    <div id="settingsBody"></div>
  `;
  document.getElementById('closeBtn').addEventListener('click', closeOverlay);
  drawer.querySelectorAll('.settings-tab').forEach(btn=>btn.addEventListener('click',()=>{ settingsTab=btn.dataset.tab; renderSettingsDrawer(); }));
  const body=document.getElementById('settingsBody');
  if(settingsTab==='general'){
    body.innerHTML=`
      <div class="field"><label>本机存储</label><div class="sync-preview">本地已保存 <b>${localCount}</b> 个项目，数据仅在当前设备。同步为可选项，未启用时所有操作均在本地完成，离线可用。</div></div>
      <div class="field"><label>关于</label><div style="font-size:12px;color:var(--apx-muted);line-height:1.6;margin-top:4px;">Agent Workbench · Tauri 三端 + Cloudflare 可选同步。同步开启后：打开/切回窗口/每 60 秒自动拉取，后台推送防抖 500ms。</div></div>
      <div style="display:flex;gap:8px;margin-top:18px;"><button class="apx-btn apx-btn-utility" id="goSyncBtn" style="flex:1;">去设置同步 →</button></div>
    `;
    document.getElementById('goSyncBtn').addEventListener('click',()=>{ settingsTab='sync'; renderSettingsDrawer(); });
  } else {
    body.innerHTML=`
      <div class="error-box hidden" id="st-error" style="background:#FBF1DF;color:#B4432F;border-radius:8px;padding:10px 14px;font-size:12px;margin-bottom:16px;">${prefillError?prefillError:''}</div>
      <div class="field" style="margin-bottom:14px;"><label>Worker 地址</label><input type="text" class="mono" id="st-url" placeholder="https://agent-workbench-sync.xxx.workers.dev" value="${hasSync?esc(settings.url):''}" style="width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--apx-hairline);font-size:13px;"></div>
      <div class="field" style="margin-bottom:14px;"><label>同步密钥（X-Sync-Token）</label><input type="password" class="mono" id="st-token" placeholder="部署时设置的密钥" value="${hasSync?esc(settings.token):''}" style="width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--apx-hairline);font-size:13px;"><div style="font-size:11px;color:var(--apx-muted);margin-top:4px;">密钥仅存本机，不会发往除 Worker 外的任何地方。留空即视为关闭同步。</div></div>

function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function stageInfo(key){ return STAGES.find(s=>s.key===key)||STAGES[0]; }
function stageIndex(key){ return STAGES.findIndex(s=>s.key===key); }
function esc(str){ const d=document.createElement('div'); d.textContent=str??''; return d.innerHTML; }
function relTime(iso){
  if(!iso) return '';
  const diff=Date.now()-new Date(iso).getTime();
  const min=Math.floor(diff/60000);
  if(min<1) return '刚刚';
  if(min<60) return min+' 分钟前';
  const hr=Math.floor(min/60);
  if(hr<24) return hr+' 小时前';
  const day=Math.floor(hr/24);
  if(day<30) return day+' 天前';
  return new Date(iso).toLocaleDateString('zh-CN');
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer=setTimeout(()=>t.classList.remove('show'),2200);
}

function renderPromptList(p){

        <button class="apx-btn" data-act="delete" style="background:#fff;border:1px solid var(--apx-hairline);font-size:12px;min-height:32px;">删除</button>
      </div>
    </div>`).join('');
}
function bindPromptListEvents(projectId){
  const container=document.getElementById('promptList');
  container.querySelectorAll('.prompt-card').forEach(card=>{
    const promptId=card.dataset.promptId;
    card.querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const act=btn.dataset.act;
        if(act==='current') setCurrentPrompt(projectId,promptId);
        else if(act==='edit'){ const p=state.projects.find(x=>x.id===projectId); showPromptForm(projectId,p.prompts.find(x=>x.id===promptId)); }
        else if(act==='delete') deletePrompt(projectId,promptId);
      });
    });
  });
}
function showPromptForm(projectId, existing){
  const slot=document.getElementById('promptFormSlot');
  const p=state.projects.find(x=>x.id===projectId);
  const nextVersion=existing?existing.version:(Math.max(0,...(p.prompts||[]).map(pr=>pr.version))+1);

      <div class="field"><label>版本号</label><input type="text" id="pf-version" value="${nextVersion}" style="width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--apx-hairline);"></div>

      <div class="field"><label>备注</label><input type="text" id="pf-notes" value="${existing?esc(existing.notes||''):''}" placeholder="这版改了什么、效果如何…" style="width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--apx-hairline);"></div>
      <div style="display:flex;gap:8px;"><button class="apx-btn apx-btn-primary" id="pf-save" style="flex:1;">${existing?'保存修改':'添加'}</button><button class="apx-btn" id="pf-cancel" style="background:#fff;border:1px solid var(--apx-hairline);">取消</button></div>
    </div>`;
  document.getElementById('pf-cancel').addEventListener('click',()=>{ slot.innerHTML=''; });
  document.getElementById('pf-save').addEventListener('click',()=>{
    const title=document.getElementById('pf-title').value.trim();
    const content=document.getElementById('pf-content').value.trim();
    if(!title||!content){ showToast('标题和内容都要填写'); return; }
    const version=parseFloat(document.getElementById('pf-version').value)||nextVersion;

    if(existing){ Object.assign(existing,{title,content,version,notes}); }

    proj.updatedAt=new Date().toISOString();
    saveData(); slot.innerHTML='';
    document.getElementById('promptList').innerHTML=renderPromptList(proj);
    bindPromptListEvents(projectId);
    document.querySelector('#drawer h3').textContent=`Prompt 版本 (${proj.prompts.length})`;
    render(); showToast(existing?'Prompt 已更新':'Prompt 已添加');
  });

function setCurrentPrompt(projectId,promptId){
  const p=state.projects.find(x=>x.id===projectId);
  p.prompts.forEach(pr=>pr.isCurrent=(pr.id===promptId));
  p.updatedAt=new Date().toISOString();
  saveData();
  document.getElementById('promptList').innerHTML=renderPromptList(p);
  bindPromptListEvents(projectId); render();
}
function deletePrompt(projectId,promptId){
  if(!confirm('确定删除这条 Prompt 吗？')) return;
  const p=state.projects.find(x=>x.id===projectId);
  p.prompts=p.prompts.filter(pr=>pr.id!==promptId);
  if(p.prompts.length&&!p.prompts.some(pr=>pr.isCurrent)) p.prompts[0].isCurrent=true;
  p.updatedAt=new Date().toISOString();
  saveData();
  document.getElementById('promptList').innerHTML=renderPromptList(p);
  bindPromptListEvents(projectId); render(); showToast('已删除');
}

  render();
  if(hasSyncSettings()){ setSyncStatus('syncing'); await pullFromServer(false); } else { setSyncStatus('idle'); }
  if(window.ApxLiquidGlass && document.getElementById('lgScene')){
    try{
      await window.ApxLiquidGlass.applyAll();
      const sidebar=document.getElementById('sidebar');
      const drawer=document.getElementById('drawer');
      const inst=window.ApxLiquidGlass.instances[0];
      // 侧栏与抽屉均为内收玻璃岛，背景柔光井可见，克制参数
      if(inst && sidebar && sidebar._lg) inst.updateConfig(sidebar,{ blur:0.24, refraction:1.08, chroma:0.14, cornerRadius:16, zRadius:28 });
      if(inst && drawer && drawer._lg) inst.updateConfig(drawer,{ blur:0.28, refraction:1.10, chroma:0.16, cornerRadius:16, zRadius:32 });
    }catch(e){ console.warn('[glass] T3 init fallback',e); }
  }
})();
</script>
</body>
</html>
